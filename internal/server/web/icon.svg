<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Conveyor">
  <!-- A belt with three equal items on it, the leading one lit. Equal boxes on
       purpose: on a line, progress is position, never size. Two shapes survive
       at 16px — the rail and the amber square about to leave it — and that is
       the whole mark. -->
  <rect width="32" height="32" rx="7.5" fill="#14181d"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7" fill="none" stroke="#2b323c" stroke-width="1.2"/>

  <!-- the items, evenly spaced, moving right -->
  <rect x="5.5" y="12.5" width="6" height="6" rx="1.5" fill="#39424f"/>
  <rect x="13" y="12.5" width="6" height="6" rx="1.5" fill="#5b6674"/>
  <rect x="20.5" y="12.5" width="6" height="6" rx="1.5" fill="#e0a13a"/>

  <!-- the belt, and just enough roller to read as machinery -->
  <path d="M5 21.5h22" stroke="#535d6d" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="8.5" cy="24.8" r="1.4" fill="#2b323c"/>
  <circle cx="16" cy="24.8" r="1.4" fill="#2b323c"/>
  <circle cx="23.5" cy="24.8" r="1.4" fill="#2b323c"/>
</svg>
