<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conveyor</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  /* An instrument panel for a production line. Graphite and steel throughout;
     the only saturated colour in the interface is a signal, so state is the one
     thing that can draw the eye. */
  :root {
    --ground:#14181d;      /* painted machinery, not black */
    --panel:#1a1f26;
    --raised:#20262f;
    --rule:#2b323c;
    --rule-soft:#232932;
    --ink:#dfe4ec;
    --dim:#7d8798;
    --faint:#535d6d;

    --run:#e0a13a;         /* amber: working */
    --ok:#4caf72;          /* green: done */
    --stop:#e05a4f;        /* red: needs a human */

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --station: 236px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground:#eceef1; --panel:#f7f8fa; --raised:#fff;
      --rule:#ccd2da; --rule-soft:#dee2e8;
      --ink:#171c23; --dim:#5b6474; --faint:#8b94a3;
    }
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font:400 13px/1.5 var(--mono);
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible { outline:2px solid var(--run); outline-offset:2px; }

  /* ---- masthead ---------------------------------------------------------- */
  .masthead {
    display:flex; align-items:baseline; gap:18px;
    padding:16px 22px 14px; border-bottom:1px solid var(--rule);
    background:var(--panel);
  }
  .glyph { display:block; border-radius:5px; }
  .mark { font-size:13px; letter-spacing:.34em; text-transform:uppercase; font-weight:500; }
  .readout { display:flex; gap:16px; color:var(--dim); font-size:11px; letter-spacing:.06em; }
  .readout b { color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; }
  .grow { flex:1; }

  .lamp { width:6px; height:6px; border-radius:50%; background:var(--faint); display:inline-block; }
  .lamp.idle { background:var(--ok); }
  .lamp.busy { background:var(--run); animation:pulse 1.1s ease-in-out infinite; }
  .lamp.down { background:var(--stop); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

  .ctl {
    font:inherit; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--dim); background:transparent; border:1px solid var(--rule);
    padding:6px 13px; cursor:pointer;
  }
  .ctl:hover:not(:disabled) { color:var(--ink); border-color:var(--faint); }
  .ctl:disabled { opacity:.35; cursor:default; }
  .ctl.primary { color:var(--ink); border-color:var(--faint); }

  /* ---- the line ---------------------------------------------------------- */
  .line { padding:30px 22px 40px; overflow-x:auto; }
  .rail { display:flex; align-items:flex-start; min-width:min-content; position:relative; }

  .station { flex:0 0 var(--station); position:relative; z-index:1; padding-right:14px; }
  .station:last-child { padding-right:0; }

  .plate {
    background:var(--panel); border:1px solid var(--rule); padding:9px 11px 10px;
    height:52px; /* fixed, so the belt meets every station at the same height */
  }
  .station.live .plate { border-color:var(--run); }
  .name {
    font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
  .count { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  .runs-label { margin-top:5px; font-size:10.5px; color:var(--faint); letter-spacing:.05em; }
  .runs-label b { color:var(--run); font-weight:400; }

  /* The belt: each station's queue carries the line as its top edge, stretched
     into the gutter so the segments meet and read as one continuous run. */
  .queue {
    margin:14px -14px 0 0; padding:14px 14px 0 0;
    border-top:1px solid var(--rule);
    display:flex; flex-direction:column; gap:6px;
  }
  .station.live .queue { border-top-color:var(--run); }
  /* Direction, marked once per station rather than decorating every gap. */
  .station { position:relative; }
  .station::after {
    content:""; position:absolute; right:-3px; top:calc(14px + var(--plate-h, 52px));
    width:5px; height:5px; margin-top:-2px;
    border-top:1px solid var(--rule); border-right:1px solid var(--rule);
    transform:rotate(45deg);
  }
  .station:last-of-type::after { display:none; }
  .slot { border:1px dashed var(--rule-soft); padding:9px 10px; color:var(--faint); font-size:11px; }

  .item {
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--raised); border:1px solid var(--rule);
    /* The left edge is the item's identity — which repository it came from.
       Signal colours stay reserved for state, so these are muted and never
       compete with a red card for attention. */
    border-left:3px solid var(--src, var(--faint));
    padding:9px 11px; color:inherit; font:inherit;
  }
  .item:hover { border-color:var(--faint); }
  .item { cursor:grab; }
  .item:active { cursor:grabbing; }
  .item.dragging { opacity:.35; }
  /* Where it will land, drawn on the belt's own vocabulary: a bright rule. */
  .item.over-before { box-shadow:0 -2px 0 var(--run); }
  .item.over-after  { box-shadow:0 2px 0 var(--run); }
  /* The column a dropped card would start in. The whole column lights rather
     than a rule between two cards, because this drop is not a position in a
     list — it is "run this here, now". */
  .queue.over-stage {
    background:color-mix(in srgb, var(--run) 7%, transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--run) 40%, transparent);
  }
  /* Why a drop did nothing, on the card that was dropped. */
  .item .refused {
    display:block; margin-top:6px; color:var(--stop);
    font-size:10.5px; line-height:1.4;
  }
  .rank {
    color:var(--faint); font-variant-numeric:tabular-nums;
    border:1px solid var(--rule-soft); border-radius:2px; padding:0 4px;
  }
  .item.ranked .rank { color:var(--run); border-color:color-mix(in srgb, var(--run) 45%, var(--rule)); }
  .item .title { font-size:12px; line-height:1.45; }
  .item .foot {
    margin-top:7px; display:flex; gap:9px; align-items:center;
    color:var(--faint); font-size:10.5px; letter-spacing:.04em;
  }
  .item .prio { font-variant-numeric:tabular-nums; }
  /* Priority is loud in the badge, not on the edge: the edge says where the
     item is from, and that does not change. */
  .item.p0 .prio { color:var(--stop); font-weight:600; }
  .item.p1 .prio { color:var(--run); }
  /* The item an agent has in hand. Loud on purpose: it is the one thing on the
     board that is changing while you look at it. */
  .item.working {
    border-color:var(--run);
    box-shadow:0 0 0 1px var(--run), 0 0 18px -4px var(--run);
    animation:breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { box-shadow:0 0 0 1px var(--run), 0 0 18px -4px var(--run); }
    50%     { box-shadow:0 0 0 1px var(--run), 0 0 4px -2px var(--run); }
  }
  .working-tag {
    color:var(--run); letter-spacing:.14em; text-transform:uppercase; font-size:9.5px;
  }
  .working-tag::before {
    content:""; display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--run); margin-right:5px; vertical-align:middle;
    animation:pulse 1.1s ease-in-out infinite;
  }
  .station.live .plate {
    border-color:var(--run);
    box-shadow:inset 2px 0 0 var(--run);
  }
  .src { color:var(--src, var(--faint)); }
  .open {
    margin-left:auto; color:var(--faint); text-decoration:none;
    border:1px solid var(--rule-soft); border-radius:2px; padding:0 4px; line-height:1.5;
  }
  .open:hover { color:var(--ink); border-color:var(--faint); }

  /* An item that needs a human. It has not gone anywhere — it is standing in
     the stage it stopped in — so the mark is on the card and the column keeps
     it in place. Red, because CONTRACTS §6 makes "what needs me?" the first
     question the board answers. */
  .item.blocked {
    border-color:color-mix(in srgb, var(--stop) 55%, var(--rule));
    background:color-mix(in srgb, var(--stop) 6%, var(--raised));
  }
  .item.blocked .title { color:var(--ink); }
  .blocked-tag {
    color:var(--stop); letter-spacing:.14em; text-transform:uppercase; font-size:9.5px;
  }
  .blocked-tag::before {
    content:""; display:inline-block; width:5px; height:5px;
    background:var(--stop); margin-right:5px; vertical-align:middle;
  }
  .count .held { color:var(--stop); }

  /* Terminal stations sit after a gap, joined by a short spur. */
  .terminus { flex:0 0 auto; padding-left:30px; position:relative; z-index:1; }
  .terminus .plate { min-width:158px; }
  .terminus .queue { margin-right:0; padding-right:0; border-top-color:var(--rule-soft); }
  .terminus::before {
    content:""; position:absolute; left:0; top:calc(14px + 52px); width:30px; height:1px;
    background:var(--rule);
  }
  .terminus .plate { border-color:color-mix(in srgb, var(--ok) 45%, var(--rule)); }
  .terminus .name { color:var(--ok); }

  /* ---- sources ---------------------------------------------------------- */
  .sources {
    display:flex; gap:16px; flex-wrap:wrap; align-items:center;
    padding:10px 22px; border-bottom:1px solid var(--rule); background:var(--panel);
    font-size:11px; color:var(--dim);
  }
  .src-chip { display:flex; align-items:center; gap:7px; }
  .src-chip .swatch { width:9px; height:2px; background:var(--src); }
  .src-chip .repo { color:var(--faint); }
  .src-chip .n { color:var(--ink); font-variant-numeric:tabular-nums; }
  .src-chip.broken .name { color:var(--stop); }
  .src-chip.broken .swatch { background:var(--stop); }

  /* The agents' own report on themselves. A strip above the sources, because
     an agent over its usage limit stops every source at once, and that is the
     first thing to know when a board has gone quiet. */
  .agents { display:flex; gap:20px; flex-wrap:wrap; align-items:center;
    padding:9px 22px; border-bottom:1px solid var(--rule); background:var(--panel);
    font-size:11px; color:var(--dim); }
  .agent { display:flex; align-items:baseline; gap:8px; }
  .agent .who { color:var(--ink); letter-spacing:.1em; text-transform:uppercase; font-size:9.5px; }
  .agent .say { color:var(--dim); }
  .agent.limited .who, .agent.limited .say { color:var(--stop); }
  .agent .resets { color:var(--faint); }
  .agent details { display:inline; }
  .agent summary { cursor:pointer; color:var(--faint); list-style:none; }
  .agent summary::-webkit-details-marker { display:none; }
  .agent .facts { display:flex; gap:14px; flex-wrap:wrap; padding-top:6px; color:var(--faint); }
  .agent .facts b { color:var(--dim); font-weight:400; }

  /* Why an item stopped, on the item. The reason is the whole point of the
     mark: a red card that cannot say what it wants is just a red card. */
  .item .why {
    display:block; margin-top:7px; padding-top:7px; border-top:1px solid var(--rule-soft);
    color:var(--dim); font-size:10.5px; line-height:1.5;
  }
  .item .why .hand {
    display:inline-block; margin-top:6px; color:var(--stop); cursor:pointer;
    border:1px solid color-mix(in srgb, var(--stop) 45%, var(--rule)); border-radius:2px;
    padding:1px 6px; background:none; font:inherit; font-size:10px;
    letter-spacing:.08em; text-transform:uppercase;
  }
  .item .why .hand:hover { background:color-mix(in srgb, var(--stop) 14%, transparent); }

  /* ---- faults ------------------------------------------------------------ */
  .faults { margin:0 22px; border-left:2px solid var(--stop); background:var(--panel); padding:12px 16px; }
  .faults h2 { margin:0 0 3px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--stop); font-weight:500; }
  .faults div { color:var(--dim); font-size:11.5px; line-height:1.7; }
  .faults b { color:var(--ink); font-weight:500; }

  /* ---- inspection panel -------------------------------------------------- */
  .scrim {
    position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none;
    transition:opacity .16s ease; z-index:9;
  }
  .scrim.open { opacity:1; pointer-events:auto; }
  aside {
    position:fixed; top:0; right:0; width:min(700px, 96vw); height:100%;
    background:var(--panel); border-left:1px solid var(--rule);
    display:flex; flex-direction:column; transform:translateX(100%);
    transition:transform .18s cubic-bezier(.4,0,.2,1); z-index:10;
  }
  aside.open { transform:none; }
  .ahead { display:flex; align-items:flex-start; gap:14px; padding:16px 18px; border-bottom:1px solid var(--rule); }
  .ahead h2 { margin:0; font-size:13px; font-weight:500; line-height:1.5; }
  .ahead .sub { margin-top:5px; color:var(--faint); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; }

  /* A run history is genuinely a sequence, so it is drawn as one. */
  .history { flex:0 0 auto; max-height:30vh; overflow-y:auto; padding:12px 18px; border-bottom:1px solid var(--rule); }
  .tr {
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:transparent; border:0; border-left:1px solid var(--rule);
    color:var(--dim); font:inherit; font-size:11px; padding:6px 0 6px 15px;
    cursor:pointer; position:relative;
  }
  .tr::before {
    content:""; position:absolute; left:-3.5px; top:50%; margin-top:-2.5px;
    width:5px; height:5px; border-radius:50%; background:var(--faint);
  }
  .tr:hover { color:var(--ink); }
  .tr.sel { color:var(--ink); border-left-color:var(--faint); }
  .tr.sel::before { background:var(--ink); }
  .tr .when { flex:0 0 62px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .tr .kind { flex:0 0 54px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; font-size:10px; }
  .tr .path { flex:1; }
  .tr .arrow { color:var(--faint); }
  .tr .verdict { letter-spacing:.06em; font-size:10.5px; }
  .tr.success .verdict { color:var(--ok); }      .tr.success::before { background:var(--ok); }
  .tr.failure .verdict, .tr.timeout .verdict { color:var(--stop); }
  .tr.failure::before, .tr.timeout::before { background:var(--stop); }
  .tr.blocked .verdict { color:var(--run); }      .tr.blocked::before { background:var(--run); }
  .tr.running .verdict { color:var(--run); }      .tr.running::before { background:var(--run); animation:pulse 1.1s ease-in-out infinite; }
  /* Killed, not failed: it never reached a verdict. */
  .tr.interrupted .verdict { color:var(--faint); font-style:italic; }
  .tr.interrupted::before { background:transparent; box-shadow:inset 0 0 0 1px var(--faint); }

  .log {
    margin:0; flex:1 1 auto; min-height:0; overflow:auto; padding:14px 18px;
    font-size:11.5px; line-height:1.7; color:var(--dim);
  }
  .log:empty::after { content:"No output."; color:var(--faint); }
  .ln { white-space:pre-wrap; word-break:break-word; }
  .ln.blank { height:.55em; }
  /* stderr is where a script says something went wrong, and where the blocked
     convention is reported. It should not look like prose. */
  .ln.stderr { color:var(--stop); }
  .ln.engine { color:var(--run); font-style:italic; }
  /* A tool call is an event, not a sentence: the agent did something. */
  .ln.tool {
    color:var(--ink); margin:3px 0 3px -8px; padding-left:8px;
    border-left:2px solid var(--run);
  }
  .ln.tool .tname { color:var(--run); letter-spacing:.06em; }
  .ln.tool .targ { color:var(--dim); }
  .ln.head { color:var(--ink); font-weight:600; margin-top:9px; }
  .ln.rule { border-top:1px solid var(--rule-soft); margin:8px 0; height:0; }
  .ln .bullet { color:var(--faint); }
  .log code {
    background:color-mix(in srgb, var(--ink) 8%, transparent);
    color:var(--ink); padding:0 3px; border-radius:2px;
  }
  .log strong { color:var(--ink); font-weight:600; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation:none !important; transition:none !important; }
  }
  @media (max-width: 640px) {
    :root { --station: 200px; }
    .masthead { flex-wrap:wrap; gap:10px; }
  }
</style>
</head>
<body>

<div class="masthead">
  <img class="glyph" src="/icon.svg" width="22" height="22" alt="">
  <span class="mark">Conveyor</span>
  <span class="readout">
    <span><span class="lamp" id="lamp"></span></span>
    <span id="line1">connecting</span>
  </span>
  <span class="grow"></span>
  <button class="ctl" id="unblock-all" hidden>Unblock all</button>
  <button class="ctl" id="refresh">Refresh</button>
  <button class="ctl primary" id="tick">Tick once</button>
</div>

<div id="agents"></div>
<div id="sources"></div>
<div id="faults"></div>
<div class="line"><div class="rail" id="rail"></div></div>

<div class="scrim" id="scrim"></div>
<aside id="panel" aria-hidden="true">
  <div class="ahead">
    <div style="flex:1">
      <h2 id="ptitle">—</h2>
      <div class="sub" id="psub"></div>
    </div>
    <button class="ctl" id="close">Close</button>
  </div>
  <div class="history" id="history"></div>
  <div class="log" id="log"></div>
</aside>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let state = null, openItemId = null, followRun = null;
// Dragging ends in a click; without this, dropping a card also opens it.
let dragging = null, justDragged = false;
// Why each marked item is marked, keyed by item id — the engine's note, not the
// provider's. See State.Blocks.
let blocks = {};
const clock = iso => { const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); };

async function load() {
  try {
    state = await (await fetch("/api/state")).json();
    draw();
  } catch { fault("disconnected"); }
}

function fault(msg) { $("#lamp").className = "lamp down"; $("#line1").textContent = msg; }

function draw() {
  if (!state) return;
  const stages = state.stages || [], items = state.items || [];
  indexSources(state.sources);
  // A list, because stages run in parallel: one entry per transition in flight.
  const active = state.active || [];
  const workingOn = id => active.find(a => a.itemId === id);
  blocks = state.blocks || {};

  // Items arrive in the order the scheduler will work them, so the board does
  // not sort: it draws them in the order it is given. A card's position is the
  // claim it makes, and re-deriving that here would be a second copy of rules
  // that live in the engine, free to disagree with it.
  const bucket = {};
  for (const st of stages) bucket[st.name] = [];
  for (const it of items) {
    // The item list is from the last poll; `active` is from now. An item being
    // worked has already been moved, so show it in the stage it is being worked
    // in — otherwise it sits in its old column flagged as working, which is
    // true of two different moments and reads as a bug.
    const a = workingOn(it.id);
    (bucket[a ? a.stage : it.stage] ||= []).push(it);
  }
  // The line runs through the working stages; terminal ones leave it.
  const flow = stages.filter(s => !s.terminal);
  const ends = stages.filter(s => s.terminal);

  $("#rail").innerHTML =
    flow.map(st => station(st, bucket[st.name] || [], active)).join("") +
    ends.map(st => terminus(st, bucket[st.name] || [])).join("");

  // What each agent says about itself. The engine passes this through — which
  // limits an agent has and what counts against them is the agent's business —
  // so the page renders whatever labels came back, in the order they came.
  $("#agents").innerHTML = !(state.agents || []).length ? "" :
    `<div class="agents">${state.agents.map(a => {
      const facts = (a.detail || []).map(d =>
        `<span><b>${esc(d.label)}</b> ${esc(d.value)}</span>`).join("");
      const say = a.error ? `cannot say — ${esc(a.error)}` : esc(a.summary || "");
      return `<span class="agent ${esc(a.state || "unknown")}">
        <span class="lamp ${a.state === "limited" ? "down" : a.state === "ok" ? "idle" : ""}"></span>
        <span class="who">${esc(a.name)}</span>
        <span class="say">${say}</span>
        ${a.resetsAt ? `<span class="resets">resets ${esc(clock(a.resetsAt))}</span>` : ""}
        ${facts ? `<details><summary>details</summary><span class="facts">${facts}</span></details>` : ""}
      </span>`;
    }).join("")}</div>`;

  // Handing the whole board back is the answer to one situation — the thing
  // that stopped everything is fixed — so the control only exists then.
  const marked = items.filter(it => it.blocked).length;
  const all = $("#unblock-all");
  all.hidden = !marked;
  all.textContent = `Unblock all (${marked})`;

  // A key for the edge colours, and the list of what is enrolled: without it
  // the colours are decoration, because nothing says which repo is which.
  const counts = {};
  for (const it of items) counts[it.source] = (counts[it.source] || 0) + 1;
  $("#sources").innerHTML = `<div class="sources">${
    (state.sources || []).map(s => {
      const broken = (s.problems || []).length > 0;
      return `<span class="src-chip${broken ? " broken" : ""}" style="--src:${sourceColour(s.name)}"
          title="${esc(s.workdir || "")}">
        <span class="swatch"></span>
        <span class="name">${esc(s.name)}</span>
        <span class="n">${counts[s.name] || 0}</span>
        ${broken ? `<span class="repo">cannot run</span>` : ""}
      </span>`;
    }).join("")
  }</div>`;

  const bad = (state.sources || []).filter(s => (s.problems || []).length);
  $("#faults").innerHTML = bad.length ? `<div class="faults">
      <h2>${bad.length} source${bad.length > 1 ? "s" : ""} cannot run</h2>
      ${bad.map(s => `<div><b>${esc(s.name)}</b> — ${s.problems.map(esc).join("<br>")}</div>`).join("")}
    </div>` : "";

  $("#lamp").className = "lamp " + (active.length || state.polling ? "busy" : "idle");
  const when = state.updatedAt ? new Date(state.updatedAt).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"}) : "—";
  const held = marked;
  $("#line1").innerHTML = active.length === 1
    ? `<b>${esc(active[0].stage)}</b> running &middot; ${esc(active[0].itemId)}`
    : active.length
      ? `<b>${active.length}</b> running &middot; ${active.map(a => esc(a.stage)).join(", ")}`
      : `<b>${items.length}</b> items &middot; ${(state.sources||[]).length} sources${
          held ? ` &middot; <b>${held}</b> blocked` : ""} &middot; ${when}`;

  document.querySelectorAll(".item").forEach(el => {
    const open = () => { if (!justDragged) inspect(el.dataset.id, el.dataset.title, el.dataset.stage); };
    el.onclick = e => {
      const hand = e.target.closest("[data-hand]");
      if (hand) { e.stopPropagation(); handBack(hand.dataset.hand, hand); return; }
      if (!e.target.closest("a")) open();
    };
    el.onkeydown = e => {
      if ((e.key === "Enter" || e.key === " ") && !e.target.closest("a")) { e.preventDefault(); open(); }
    };
    wireDrag(el);
  });
  document.querySelectorAll(".queue[data-stage]").forEach(wireQueue);
}

function station(st, items, active) {
  const live = active.some(a => a.stage === st.name);
  return `<section class="station${live ? " live" : ""}">
    <div class="plate">
      <div class="name">${esc(st.name)}${tally(items)}</div>
      <div class="runs-label">${st.script ? `runs <b>${esc(st.script)}</b>` : st.runs ? "runs inline" : "queue"}</div>
    </div>
    <div class="queue" data-stage="${esc(st.name)}">${
      items.length ? items.map((it, i) => card(it, active, i)).join("")
                   : `<div class="slot">empty</div>`}</div>
  </section>`;
}

function terminus(st, items) {
  return `<section class="terminus">
    <div class="plate">
      <div class="name">${esc(st.name)}${tally(items)}</div>
      <div class="runs-label">end of line</div>
    </div>
    <div class="queue">${items.map(it => card(it, [], null)).join("")}</div>
  </section>`;
}

// How many are here, and how many of those are not moving. Blocked is no longer
// a column to look at, so the count is where a stage says it is holding
// something a person has to deal with.
function tally(items) {
  const held = items.filter(it => it.blocked).length;
  return `<span class="count">${items.length}${
    held ? ` &middot; <span class="held">${held} blocked</span>` : ""}</span>`;
}

function card(it, active, place) {
  // Number, or nothing. `undefined !== null` is true, so a missing argument
  // used to render "NaN" in the rank badge rather than omitting it.
  const ranked = Number.isInteger(place);
  const hasPrio = it.priority !== null && it.priority !== undefined;
  const working = active.some(a => a.itemId === it.id);
  const cls = ["item", hasPrio ? "p" + it.priority : "", working ? "working" : "",
               it.blocked ? "blocked" : "", ranked ? "ranked" : ""].filter(Boolean).join(" ");
  return `<article class="${cls}" draggable="true" tabindex="0" role="button"
      style="--src:${sourceColour(it.source)}"
      data-id="${esc(it.id)}" data-title="${esc(it.title)}" data-stage="${esc(it.stage)}">
    <span class="title">${esc(it.title)}</span>
    <span class="foot">
      ${working ? `<span class="working-tag">working</span>` : ""}
      ${it.blocked ? `<span class="blocked-tag">blocked</span>` : ""}
      ${ranked && !working && !it.blocked ? `<span class="rank">${place + 1}</span>` : ""}
      <span class="prio">${hasPrio ? "p" + it.priority : "—"}</span>
      <span class="src">${esc(it.id)}</span>
      ${it.url ? `<a class="open" href="${esc(it.url)}" target="_blank" rel="noopener"
           title="Open on GitHub" aria-label="Open ${esc(it.id)} on GitHub">&#8599;</a>` : ""}
    </span>
    ${refusals.has(it.id) ? `<span class="refused">${esc(refusals.get(it.id))}</span>` : ""}
    ${it.blocked ? why(it) : ""}
  </article>`;
}

// The mark's reason, and the one control that answers it. A blocked card that
// cannot say what it is waiting for sends you to the logs to find out, which is
// the trip the mark was supposed to save.
function why(it) {
  const b = blocks[it.id];
  return `<span class="why">
    ${b ? esc(b.reason) : "no reason recorded"}
    <button class="hand" data-hand="${esc(it.id)}"
      title="Clear the mark and hand this back to the pipeline">Hand back</button>
  </span>`;
}

// One hue per source, spread evenly around the wheel rather than hashed from
// the name: hashing put midgame, quesshi and caravan-v2 within 21 degrees of
// each other, which reads as one colour. Position gives maximal separation for
// however many sources there are.
//
// The span starts past the reds and ambers so a repository's identity can never
// be mistaken for a failure or for work in progress.
let hueOf = new Map();
function indexSources(sources) {
  hueOf = new Map((sources || []).map((s, i, all) =>
    [s.name, `hsl(${Math.round(95 + (i * 260) / Math.max(all.length, 1))} 55% 60%)`]));
}
const sourceColour = name => hueOf.get(name) || "var(--faint)";

async function inspect(id, title, stage) {
  openItemId = id;
  $("#ptitle").textContent = title || id;
  $("#psub").textContent = `${id} · ${stage}`;
  $("#panel").classList.add("open"); $("#panel").setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("open");
  $("#log").innerHTML = "";
  await loadHistory(id);
}

async function loadHistory(id) {
  const runs = await (await fetch(`/api/runs?item=${encodeURIComponent(id)}`)).json();
  $("#history").innerHTML = runs.length ? runs.map(r => `
    <button class="tr ${esc(r.outcome)}" data-run="${esc(r.id)}">
      <span class="when">${esc((r.startedAt || "").slice(11, 19))}</span>
      <span class="kind">${esc(r.kind)}</span>
      <span class="path">${transition(r)}</span>
      <span class="verdict">${esc(r.outcome)}</span>
    </button>`).join("")
    : `<div class="slot">No runs yet.</div>`;
  document.querySelectorAll("[data-run]").forEach(b => b.onclick = () => showRun(b.dataset.run));
  if (runs.length) showRun(runs[0].id);
}

// A run whose from and to are the same stage is not a move. For a stage script
// it is a re-run of work that did not finish; for a provider write it is the
// engine confirming the item is where it already says it is. Printing
// "refining → refining" for both reads like a bug.
function transition(r) {
  const from = esc(r.from || ""), to = esc(r.to || "");
  if (!from && !to) return `<span class="arrow">poll</span>`;
  if (from === to) {
    return r.kind === "stage"
      ? `<span class="arrow">&#8635;</span> re-ran ${to}`
      : `<span class="arrow">&#8801;</span> confirmed ${to}`;
  }
  return `${from} <span class="arrow">&rarr;</span> ${to}`;
}

async function showRun(id) {
  followRun = id;
  document.querySelectorAll("[data-run]").forEach(b => b.classList.toggle("sel", b.dataset.run === id));
  const r = await (await fetch(`/api/runs/${id}`)).json();
  const log = $("#log");
  log.innerHTML = "";
  for (const line of r.lines || []) log.appendChild(renderLine(line));
  log.scrollTop = log.scrollHeight;
}

// An agent writes markdown and calls tools; showing that as one monospace blob
// throws away everything it told you about shape. Presentation only — the
// engine still reads no data out of a log, it comes back in $CONVEYOR_RESULT.
function renderLine(line) {
  const el = document.createElement("div");
  const text = line.text ?? "";
  el.className = "ln " + (line.stream === "stderr" ? "stderr"
                        : line.stream === "engine" ? "engine" : "");

  if (!text.trim()) { el.classList.add("blank"); return el; }

  // "  · Bash: git status" — the shape agents/claude/_stream emits.
  const tool = text.match(/^\s*·\s*([A-Za-z_]+):\s?([\s\S]*)$/);
  if (tool) {
    el.classList.add("tool");
    el.innerHTML = `<span class="tname">${esc(tool[1])}</span> <span class="targ">${esc(tool[2])}</span>`;
    return el;
  }
  if (/^\s*(-{3,}|={3,})\s*$/.test(text)) { el.className = "ln rule"; return el; }
  if (/^#{1,6}\s/.test(text)) {
    el.classList.add("head");
    el.innerHTML = inline(text.replace(/^#{1,6}\s/, ""));
    return el;
  }
  const bullet = text.match(/^(\s*)([-*·])\s+([\s\S]*)$/);
  if (bullet) {
    el.innerHTML = `${bullet[1]}<span class="bullet">${esc(bullet[2])}</span> ${inline(bullet[3])}`;
    return el;
  }
  el.innerHTML = inline(text);
  return el;
}

// The little markdown that actually appears in agent output. Escaped first, so
// nothing a repository contains can inject markup into the board.
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, (_, b) => `<strong>${b}</strong>`);
}

function closePanel() {
  $("#panel").classList.remove("open"); $("#panel").setAttribute("aria-hidden", "true");
  $("#scrim").classList.remove("open");
  openItemId = null; followRun = null;
}
$("#close").onclick = closePanel;
$("#scrim").onclick = closePanel;
addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

// --- dragging --------------------------------------------------------------
// Two gestures, and they are different things. Within a column a drag reorders,
// and a card's position is what the scheduler reads. Out of the backlog and
// into the next column it *starts* the work: backlog is the absence of a state,
// and deciding something leaves it is the whole of v1's control lever.
//
// Nowhere else. A card dropped straight onto a deploy stage would be a deploy
// nobody reviewed; the pipeline is human-authored ahead of time, not steered
// card by card.
const queueOf = el => el.closest(".queue[data-stage]")?.dataset.stage;
const stageBy = name => (state?.stages || []).find(st => st.name === name);
const startable = (from, into) => {
  const first = (state?.stages || [])[0];
  if (!first || from !== first.name) return false;
  return !!into && stageBy(from)?.next === into;
};

// A refusal belongs on the card that was dropped, not in a console: an operator
// who sees nothing happen concludes the board is broken.
const refusals = new Map();
function refuse(id, why) {
  refusals.set(id, why);
  draw();
  setTimeout(() => { if (refusals.delete(id)) draw(); }, 8000);
}

async function startItem(id, stage) {
  refusals.delete(id);
  const res = await fetch(`/api/items/${encodeURIComponent(id)}/start`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ stage }),
  });
  if (!res.ok) refuse(id, (await res.text()).trim() || `could not start ${id}`);
}

function wireQueue(q) {
  const into = q.dataset.stage;
  q.ondragover = e => {
    if (!dragging || !startable(queueOf(dragging), into)) return;
    e.preventDefault();
    clearMarks();
    q.classList.add("over-stage");
  };
  q.ondragleave = () => q.classList.remove("over-stage");
  q.ondrop = e => {
    if (!dragging || !startable(queueOf(dragging), into)) return;
    e.preventDefault();
    clearMarks();
    startItem(dragging.dataset.id, into);
  };
}

function wireDrag(el) {
  el.ondragstart = e => {
    dragging = el;
    el.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", el.dataset.id);
  };
  el.ondragend = () => {
    el.classList.remove("dragging");
    clearMarks();
    dragging = null;
    justDragged = true;
    setTimeout(() => justDragged = false, 0);
  };
  // A card in another column is not a drop target of its own: the column is.
  // Letting the event through to it is what makes dropping onto a full backlog's
  // neighbour work the same as dropping onto an empty one.
  const reorders = () => dragging && dragging !== el && queueOf(el) === queueOf(dragging);
  el.ondragover = e => {
    if (!reorders()) return;
    e.preventDefault();
    e.stopPropagation();
    clearMarks();
    el.classList.add(below(e, el) ? "over-after" : "over-before");
  };
  el.ondrop = e => {
    if (!reorders()) return;
    e.preventDefault();
    e.stopPropagation();
    el.parentNode.insertBefore(dragging, below(e, el) ? el.nextSibling : el);
    clearMarks();
    saveOrder();
  };
}

const below = (e, el) => {
  const r = el.getBoundingClientRect();
  return e.clientY > r.top + r.height / 2;
};
const clearMarks = () =>
  document.querySelectorAll(".over-before,.over-after,.over-stage")
    .forEach(n => n.classList.remove("over-before", "over-after", "over-stage"));

// Read the board back as one list. Stage order dominates and the drag decides
// within a stage — an item further along the line should not be overtaken by
// one that has not started, so the queues are read from the end of the line
// back towards the start. Reading them left to right says the opposite: it
// ranks the whole backlog above work already under way.
async function saveOrder() {
  const flow = (state?.stages || []).filter(st => !st.terminal).reverse();
  const ids = flow.flatMap(st =>
    [...document.querySelectorAll(`.queue[data-stage="${CSS.escape(st.name)}"] .item`)]
      .map(el => el.dataset.id));
  // Never save an empty order while the board holds cards. A selector that
  // stops matching would otherwise wipe a hand-made arrangement silently —
  // which is exactly what a missing data-stage attribute once did.
  if (!ids.length && document.querySelectorAll(".queue[data-stage] .item").length) {
    console.warn("refusing to save an empty order");
    return;
  }
  await fetch("/api/order", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(ids),
  });
}

// Clearing a mark is a provider write, so the control says so while it lands:
// a card that keeps its red for another second reads as a button that did
// nothing, and the second press is the one that races.
async function handBack(id, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "handing back"; }
  const res = await fetch(`/api/items/${encodeURIComponent(id)}/unblock`, { method:"POST" });
  if (!res.ok) refuse(id, (await res.text()).trim() || `could not unblock ${id}`);
}

$("#unblock-all").onclick = async e => {
  const n = (state?.items || []).filter(it => it.blocked).length;
  if (!confirm(`Clear the mark on ${n} item${n === 1 ? "" : "s"}? Each goes straight back into the line.`)) return;
  e.target.disabled = true;
  e.target.textContent = "handing back…";
  await fetch("/api/unblock", { method:"POST" });
  setTimeout(() => e.target.disabled = false, 2000);
};

$("#refresh").onclick = () => fetch("/api/refresh", { method:"POST" });
$("#tick").onclick = async e => {
  e.target.disabled = true;
  const res = await fetch("/api/tick", { method:"POST" });
  if (res.status === 409) $("#line1").textContent = "a tick is already in flight";
  setTimeout(() => e.target.disabled = false, 1500);
};

const es = new EventSource("/api/events");
es.onmessage = ev => {
  const e = JSON.parse(ev.data);
  if (e.kind === "log") {
    if (e.runId === followRun && e.line) {
      const log = $("#log");
      const pinned = log.scrollHeight - log.scrollTop - log.clientHeight < 48;
      log.appendChild(renderLine(e.line));
      if (pinned) log.scrollTop = log.scrollHeight;
    }
    return;
  }
  if (e.kind === "transition" && openItemId && e.transition?.item?.id === openItemId) loadHistory(openItemId);
  load();
};
es.onerror = () => fault("disconnected");

load();
</script>
</body>
</html>
