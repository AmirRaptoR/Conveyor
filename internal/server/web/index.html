<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conveyor</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* An instrument panel for a production line. Graphite and steel throughout;
     the only saturated colour in the interface is a signal, so state is the one
     thing that can draw the eye. */
  :root {
    --ground:#14181d;      /* painted machinery, not black */
    --panel:#1a1f26;
    --raised:#20262f;
    --rule:#2b323c;
    --rule-soft:#232932;
    --ink:#dfe4ec;
    --dim:#7d8798;
    --faint:#535d6d;

    --run:#e0a13a;         /* amber: working */
    --ok:#4caf72;          /* green: done */
    --stop:#e05a4f;        /* red: a fault */
    --ask:#9b87f5;         /* violet: a question only you can answer */

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
    --station: 236px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground:#eceef1; --panel:#f7f8fa; --raised:#fff;
      --rule:#ccd2da; --rule-soft:#dee2e8;
      --ink:#171c23; --dim:#5b6474; --faint:#8b94a3;
    }
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font:400 13.5px/1.5 var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  /* Prose in a sans; the instrument readouts — ids, counts, logs — stay mono. */
  .mark, .readout, .count, .runs-label, .src, .prio, .rank, .log, .ln, .stop .meta,
  .agent .who, .src-chip, .drow .dstatus, .why, .askstep { font-family:var(--mono); }
  :focus-visible { outline:2px solid var(--run); outline-offset:2px; }

  /* ---- masthead ---------------------------------------------------------- */
  .masthead {
    display:flex; align-items:baseline; gap:18px;
    padding:16px 22px 14px; border-bottom:1px solid var(--rule);
    background:var(--panel);
  }
  .glyph { display:block; border-radius:5px; }
  .mark { font-size:13px; letter-spacing:.34em; text-transform:uppercase; font-weight:500; }
  .readout { display:flex; gap:16px; color:var(--dim); font-size:11px; letter-spacing:.06em; }
  .readout b { color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; }
  .grow { flex:1; }

  .lamp { width:6px; height:6px; border-radius:50%; background:var(--faint); display:inline-block; }
  .lamp.idle { background:var(--ok); }
  .lamp.busy { background:var(--run); animation:pulse 1.1s ease-in-out infinite; }
  .lamp.down { background:var(--stop); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

  .ctl {
    font:inherit; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--dim); background:transparent; border:1px solid var(--rule);
    padding:6px 13px; cursor:pointer;
  }
  .ctl:hover:not(:disabled) { color:var(--ink); border-color:var(--faint); }
  .ctl:disabled { opacity:.35; cursor:default; }
  .ctl.primary { color:var(--ink); border-color:var(--faint); }

  /* ---- the line ---------------------------------------------------------- */
  .rail-wrap { position:relative; }
  .line { padding:30px 22px 40px; overflow-x:auto; }
  .rail { display:flex; align-items:flex-start; min-width:min-content; position:relative; }

  /* Pinned above the rail, in `.line`'s own top padding, so it sits in the
     viewport at the top of the page even when the rail itself grows past the
     fold — the native scrollbar that lives at the rail's bottom edge does not.
     It lives outside `.line` (a sibling in `.rail-wrap`) so it never scrolls
     away with the rail's content. */
  /* The strip it occupies is otherwise empty (`.line`'s top padding), but it is
     not all drawn on — the gap between the buttons and the track's own margins
     are still part of the box. pointer-events:none there, auto only on what is
     actually interactive, so a touch or drag that starts in that strip still
     reaches `.line`/`.rail` underneath instead of being swallowed by an
     invisible hit area. */
  .railctl {
    position:absolute; top:6px; left:22px; right:22px; z-index:2;
    display:flex; align-items:center; gap:8px;
    pointer-events:none;
  }
  .railbtn {
    flex:none; width:20px; height:20px; display:flex; align-items:center; justify-content:center;
    font:inherit; line-height:1; color:var(--dim); background:var(--panel);
    border:1px solid var(--rule); cursor:pointer; padding:0;
    pointer-events:auto;
  }
  .railbtn:hover:not(:disabled) { color:var(--ink); border-color:var(--faint); }
  .railbtn:disabled { opacity:.35; cursor:default; }
  /* The visible bar stays 3px — the interactive strip is taller, so the drag
     and click targets are comfortable without changing the look. */
  .railtrack {
    flex:1; height:16px; position:relative; cursor:pointer; pointer-events:auto;
    touch-action:none;
  }
  .railtrack::before {
    content:""; position:absolute; left:0; right:0; top:50%; height:3px;
    margin-top:-1.5px; background:var(--rule-soft); border-radius:2px;
  }
  .railthumb {
    position:absolute; top:50%; height:3px; margin-top:-1.5px;
    background:var(--faint); border-radius:2px; pointer-events:none;
  }
  .railtrack:focus-visible { outline:2px solid var(--run); outline-offset:2px; }

  .station { flex:0 0 var(--station); position:relative; z-index:1; padding-right:14px; }
  .station:last-child { padding-right:0; }

  .plate {
    background:var(--panel); border:1px solid var(--rule); padding:9px 11px 10px;
    height:52px; /* fixed, so the belt meets every station at the same height */
  }
  .station.live .plate { border-color:var(--run); }
  .name {
    font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
  .count { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  .runs-label { margin-top:5px; font-size:10.5px; color:var(--faint); letter-spacing:.05em; }
  .runs-label b { color:var(--run); font-weight:400; }

  /* The belt: each station's queue carries the line as its top edge, stretched
     into the gutter so the segments meet and read as one continuous run. */
  .queue {
    margin:14px -14px 0 0; padding:14px 14px 0 0;
    border-top:1px solid var(--rule);
    display:flex; flex-direction:column; gap:6px;
  }
  .station.live .queue { border-top-color:var(--run); }
  /* Direction, marked once per station rather than decorating every gap. */
  .station { position:relative; }
  .station::after {
    content:""; position:absolute; right:-3px; top:calc(14px + var(--plate-h, 52px));
    width:5px; height:5px; margin-top:-2px;
    border-top:1px solid var(--rule); border-right:1px solid var(--rule);
    transform:rotate(45deg);
  }
  .station:last-of-type::after { display:none; }
  .slot { border:1px dashed var(--rule-soft); padding:9px 10px; color:var(--faint); font-size:11px; }

  .item {
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--raised); border:1px solid var(--rule);
    /* The left edge is the item's identity — which repository it came from.
       Signal colours stay reserved for state, so these are muted and never
       compete with a red card for attention. */
    border-left:3px solid var(--src, var(--faint));
    padding:9px 11px; color:inherit; font:inherit;
  }
  .item:hover { border-color:var(--faint); }
  .item { cursor:grab; }
  .item:active { cursor:grabbing; }
  .item.dragging { opacity:.35; }
  /* Where it will land, drawn on the belt's own vocabulary: a bright rule. */
  .item.over-before { box-shadow:0 -2px 0 var(--run); }
  .item.over-after  { box-shadow:0 2px 0 var(--run); }
  /* The column a dropped card would start in. The whole column lights rather
     than a rule between two cards, because this drop is not a position in a
     list — it is "run this here, now". */
  .queue.over-stage {
    background:color-mix(in srgb, var(--run) 7%, transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--run) 40%, transparent);
  }
  /* Why a drop did nothing, on the card that was dropped. */
  .item .refused {
    display:block; margin-top:6px; color:var(--stop);
    font-size:10.5px; line-height:1.4;
  }
  .rank {
    color:var(--faint); font-variant-numeric:tabular-nums;
    border:1px solid var(--rule-soft); border-radius:2px; padding:0 4px;
  }
  .item.ranked .rank { color:var(--run); border-color:color-mix(in srgb, var(--run) 45%, var(--rule)); }
  /* `anywhere`, not `break-all`: break only where an ordinary line would
     overflow — a title with no spaces at all is the one case that needs it. */
  .item .title { font-size:12px; line-height:1.45; overflow-wrap:anywhere; }
  .item .foot {
    margin-top:7px; display:flex; gap:9px; align-items:center; flex-wrap:wrap;
    color:var(--faint); font-size:10.5px; letter-spacing:.04em;
  }
  .item .prio { font-variant-numeric:tabular-nums; }
  /* Priority is loud in the badge, not on the edge: the edge says where the
     item is from, and that does not change. */
  .item.p0 .prio { color:var(--stop); font-weight:600; }
  .item.p1 .prio { color:var(--run); }
  /* The item an agent has in hand. Loud on purpose: it is the one thing on the
     board that is changing while you look at it. */
  .item.working {
    border-color:var(--run);
    box-shadow:0 0 0 1px var(--run), 0 0 18px -4px var(--run);
    animation:breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { box-shadow:0 0 0 1px var(--run), 0 0 18px -4px var(--run); }
    50%     { box-shadow:0 0 0 1px var(--run), 0 0 4px -2px var(--run); }
  }
  .working-tag {
    color:var(--run); letter-spacing:.14em; text-transform:uppercase; font-size:9.5px;
  }
  .working-tag::before {
    content:""; display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--run); margin-right:5px; vertical-align:middle;
    animation:pulse 1.1s ease-in-out infinite;
  }
  .station.live .plate {
    border-color:var(--run);
    box-shadow:inset 2px 0 0 var(--run);
  }
  .src { color:var(--src, var(--faint)); }
  .open {
    margin-left:auto; color:var(--faint); text-decoration:none;
    border:1px solid var(--rule-soft); border-radius:2px; padding:0 4px; line-height:1.5;
  }
  .open:hover { color:var(--ink); border-color:var(--faint); }

  /* An item that needs a human. It has not gone anywhere — it is standing in
     the stage it stopped in — so the mark is on the card and the column keeps
     it in place. Red, because CONTRACTS §6 makes "what needs me?" the first
     question the board answers. */
  .item.blocked {
    border-color:color-mix(in srgb, var(--stop) 55%, var(--rule));
    background:color-mix(in srgb, var(--stop) 6%, var(--raised));
  }
  .item.blocked .title { color:var(--ink); }
  /* Three tones of stop. A fault is red. A condition that will pass on its own
     — quota, a turn budget, an open dependency — is grey: nothing for you to
     do. A question is violet, and the only one of the three that is yours. */
  .item.blocked.waiting {
    border-color:var(--rule);
    background:color-mix(in srgb, var(--dim) 7%, var(--raised));
  }
  .item.blocked.asks {
    border-color:color-mix(in srgb, var(--ask) 65%, var(--rule));
    background:color-mix(in srgb, var(--ask) 9%, var(--raised));
    box-shadow:0 0 0 1px color-mix(in srgb, var(--ask) 35%, transparent);
  }
  .count .held { color:var(--stop); }

  /* Terminal stations sit after a gap, joined by a short spur. A terminal
     column takes a pipeline station's own basis and gutter, so its card is
     the same width as any other column's no matter what is in it; the gap
     moves into a margin, outside that basis, so nothing inside the box can
     absorb it. `min-width:0` overrides the automatic minimum size a flex
     item takes from its content — without it, a long title or stage name
     could still force the column wider than its fixed basis. */
  .terminus { flex:0 0 var(--station); margin-left:30px; padding-right:14px; min-width:0; position:relative; z-index:1; }
  .terminus .plate { min-width:0; }
  .terminus .queue { border-top-color:var(--rule-soft); }
  .terminus .plate { border-color:color-mix(in srgb, var(--ok) 45%, var(--rule)); }
  .terminus .name { color:var(--ok); }

  /* ---- sources ---------------------------------------------------------- */
  .sources {
    display:flex; gap:16px; flex-wrap:wrap; align-items:center;
    padding:10px 22px; border-bottom:1px solid var(--rule); background:var(--panel);
    font-size:11px; color:var(--dim);
  }
  .src-chip { display:flex; align-items:center; gap:7px; }
  .src-chip .swatch { width:9px; height:2px; background:var(--src); }
  .src-chip .repo { color:var(--faint); }
  .src-chip .n { color:var(--ink); font-variant-numeric:tabular-nums; }
  .src-chip.broken .name { color:var(--stop); }
  .src-chip.broken .swatch { background:var(--stop); }

  /* The agents' own report on themselves. A strip above the sources, because
     an agent over its usage limit stops every source at once, and that is the
     first thing to know when a board has gone quiet. */
  .agents { display:flex; gap:20px; flex-wrap:wrap; align-items:center;
    padding:9px 22px; border-bottom:1px solid var(--rule); background:var(--panel);
    font-size:11px; color:var(--dim); }
  .agent { display:flex; align-items:baseline; gap:8px; }
  .agent .who { color:var(--ink); letter-spacing:.1em; text-transform:uppercase; font-size:9.5px; }
  .agent .say { color:var(--dim); }
  .agent.limited .who, .agent.limited .say { color:var(--stop); }
  .agent.paused .who { color:var(--stop); }
  /* The scheduler's own state, not the agent's report: said in the agent's
     words but boxed, so "it says it is limited" and "we stopped dispatching"
     are not read as one sentence. */
  .agent .held { color:var(--stop); border:1px solid var(--stop); border-radius:3px;
    padding:0 5px; font-size:9.5px; letter-spacing:.04em; }
  .agent .resets { color:var(--faint); }
  .agent details { display:inline; }
  .agent summary { cursor:pointer; color:var(--faint); list-style:none; }
  .agent summary::-webkit-details-marker { display:none; }
  .agent .facts { display:flex; gap:14px; flex-wrap:wrap; padding-top:6px; color:var(--faint); }
  .agent .facts b { color:var(--dim); font-weight:400; }

  /* A doctor sweep: one row per marked item, updating in place as each one
     settles. Never a count — a count cannot say which item was left, only
     that some were. */
  .doctor-sweep { border:1px solid var(--rule); border-radius:6px; padding:10px 12px;
    margin:0 16px 10px; font-size:12px; }
  .doctor-sweep .dhead { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .doctor-sweep .dhead b { color:var(--ink); font-weight:400; letter-spacing:.02em; }
  .doctor-sweep .dstate { color:var(--dim); }
  .doctor-sweep .dapply { color:var(--run); }
  .drow { display:flex; gap:10px; align-items:baseline; padding:2px 0; }
  .drow .ditem { color:var(--dim); min-width:120px; }
  .drow .dstatus { text-transform:uppercase; letter-spacing:.04em; font-size:10px; min-width:64px; }
  .drow.pending .dstatus { color:var(--faint); }
  .drow.skipped .dstatus { color:var(--faint); }
  .drow.cleared .dstatus { color:var(--ok); }
  .drow.left .dstatus { color:var(--run); }
  .drow.failed .dstatus { color:var(--stop); }
  .drow .dwhy { color:var(--dim); }

  /* What kind of stop it was, on the card. One word: the paragraph is in the
     panel, because a column of paragraphs cannot be read across. */
  .item .why {
    color:var(--stop); letter-spacing:.08em; text-transform:lowercase; font-size:9.5px;
    border:1px solid color-mix(in srgb, var(--stop) 35%, var(--rule));
    border-radius:999px; padding:1px 7px;
  }
  .item .why.waiting { color:var(--dim); border-color:var(--rule); }
  .item .why.asks {
    color:var(--ask); border-color:color-mix(in srgb, var(--ask) 50%, var(--rule));
    background:color-mix(in srgb, var(--ask) 12%, transparent); font-weight:600;
  }
  /* Everything waiting on you, in one strip under the masthead — the first
     question the board answers, asked before the eye has to scan columns. */
  .needs {
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding:9px 22px; border-bottom:1px solid var(--rule);
    background:color-mix(in srgb, var(--ask) 9%, var(--panel)); font-size:12px;
  }
  .needs:empty { display:none; }
  .needs .nlabel { color:var(--ask); font-weight:600; margin-right:6px; }
  .needs .need {
    font:inherit; font-size:12px; color:var(--ink); background:var(--raised);
    border:1px solid color-mix(in srgb, var(--ask) 45%, var(--rule)); border-radius:999px;
    padding:3px 12px; cursor:pointer; max-width:340px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .needs .need:hover { border-color:var(--ask); }
  /* The done column shows the last ten; the rest come ten at a time. */
  .more {
    font:inherit; font-size:11px; color:var(--dim); background:none; cursor:pointer;
    border:1px dashed var(--rule); padding:7px; width:100%;
  }
  .more:hover { color:var(--ink); border-color:var(--faint); }

  /* And the whole of it, in the panel, with the one control that answers it. */
  .stop {
    margin:0 0 14px; border-left:2px solid var(--stop);
    background:var(--panel); padding:12px 16px;
  }
  .stop h3 {
    margin:0 0 6px; font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--stop); font-weight:500;
  }
  .stop p { margin:0; color:var(--ink); font-size:12px; line-height:1.65; white-space:pre-wrap; }
  .stop .meta { margin-top:8px; color:var(--faint); font-size:10.5px; }
  .stop.asks { border-left-color:var(--ask); }
  .stop.asks h3 { color:var(--ask); }
  .stop.waiting { border-left-color:var(--faint); }
  .stop.waiting h3 { color:var(--dim); }
  .stop .ask-btn {
    display:inline-block; margin:12px 0 0; font:inherit; font-size:12px; font-weight:600;
    color:#fff; background:var(--ask); border:0; border-radius:6px; padding:8px 16px; cursor:pointer;
  }
  .stop .ask-btn:hover { filter:brightness(1.1); }
  .stop .hand {
    margin-top:10px; color:var(--stop); cursor:pointer;
    border:1px solid color-mix(in srgb, var(--stop) 45%, var(--rule)); border-radius:2px;
    padding:3px 10px; background:none; font:inherit; font-size:10px;
    letter-spacing:.1em; text-transform:uppercase;
  }
  .stop .hand:hover { background:color-mix(in srgb, var(--stop) 14%, transparent); }
  .stop .answer {
    display:block; width:100%; box-sizing:border-box; margin-top:10px;
    background:var(--ground); color:var(--ink); font:inherit; font-size:12px;
    line-height:1.6; border:1px solid var(--rule); border-radius:2px;
    padding:7px 9px; resize:vertical;
  }
  .stop .answer:focus {
    outline:none; border-color:color-mix(in srgb, var(--stop) 45%, var(--rule));
  }
  .stop .answer::placeholder { color:var(--faint); }

  /* ---- final report -------------------------------------------------------
     Shown only for a terminal stage — everything else on the board is still
     moving, and the numbers here are only honest once the passage is done. */
  .report {
    padding:12px 18px; border-bottom:1px solid var(--rule);
    font-size:12px; line-height:1.65; color:var(--ink);
  }
  .report:empty { display:none; padding:0; border:0; }
  .report-head { display:flex; justify-content:flex-end; margin-bottom:8px; }
  .report h1 { font-size:13px; margin:0 0 8px; font-weight:500; }
  .report h2 {
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--dim); margin:16px 0 8px; font-weight:500;
  }
  .report h3 { font-size:11px; color:var(--dim); margin:12px 0 6px; font-weight:500; }
  .report p { margin:0 0 8px; color:var(--dim); }
  .report table { width:100%; border-collapse:collapse; margin:0 0 10px; font-size:11.5px; }
  .report th, .report td {
    text-align:left; padding:4px 10px 4px 0; border-bottom:1px solid var(--rule-soft);
    color:var(--dim); vertical-align:top;
  }
  .report th {
    color:var(--faint); font-weight:500; letter-spacing:.04em;
    text-transform:uppercase; font-size:10px;
  }
  .report ul { margin:0 0 8px; padding-left:18px; }
  .report li { margin-bottom:6px; color:var(--dim); }
  .report blockquote {
    margin:0 0 8px; padding-left:10px; border-left:2px solid var(--rule);
    color:var(--dim); font-style:italic;
  }
  .report code {
    background:color-mix(in srgb, var(--ink) 8%, transparent);
    color:var(--ink); padding:0 3px; border-radius:2px; font-style:normal;
  }
  .report strong { color:var(--ink); font-weight:600; }
  .report a { color:var(--run); }

  /* ---- faults ------------------------------------------------------------ */
  .faults { margin:0 22px; border-left:2px solid var(--stop); background:var(--panel); padding:12px 16px; }
  .faults h2 { margin:0 0 3px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--stop); font-weight:500; }
  .faults div { color:var(--dim); font-size:11.5px; line-height:1.7; }
  .faults b { color:var(--ink); font-weight:500; }

  /* ---- inspection panel -------------------------------------------------- */
  .scrim {
    position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none;
    transition:opacity .16s ease; z-index:9;
  }
  .scrim.open { opacity:1; pointer-events:auto; }
  aside {
    position:fixed; top:0; right:0; width:min(700px, 96vw); height:100%;
    background:var(--panel); border-left:1px solid var(--rule);
    display:flex; flex-direction:column; transform:translateX(100%);
    transition:transform .18s cubic-bezier(.4,0,.2,1); z-index:10;
  }
  aside.open { transform:none; }
  .ahead { display:flex; align-items:flex-start; gap:14px; padding:16px 18px; border-bottom:1px solid var(--rule); }
  .ahead h2 { margin:0; font-size:13px; font-weight:500; line-height:1.5; }
  .ahead .sub { margin-top:5px; color:var(--faint); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; }

  /* #stop, .report and .history read as one passage — a stop reason, then the
     report, then the history that explains it — so they share one scroll
     region rather than nesting three. `.log` stays its own: the tail-follow
     behaviour reads `.log`'s own scrollTop/scrollHeight (see the SSE
     handler), which only works if nothing above it also claims that scroll.
     The cap is a percentage of `aside` (the wrapper this sits in), not of the
     viewport, so it still means the same thing if the panel is ever resized
     independently of the window — and it leaves `.log` a guaranteed share of
     the panel's height rather than letting a long stop reason squeeze it to
     nothing. */
  .upper { flex:0 1 auto; max-height:55%; overflow-y:auto; min-height:0; }

  /* A run history is genuinely a sequence, so it is drawn as one. */
  .history { padding:12px 18px; border-bottom:1px solid var(--rule); }
  .tr {
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:transparent; border:0; border-left:1px solid var(--rule);
    color:var(--dim); font:inherit; font-size:11px; padding:6px 0 6px 15px;
    cursor:pointer; position:relative;
  }
  .tr::before {
    content:""; position:absolute; left:-3.5px; top:50%; margin-top:-2.5px;
    width:5px; height:5px; border-radius:50%; background:var(--faint);
  }
  .tr:hover { color:var(--ink); }
  .tr.sel { color:var(--ink); border-left-color:var(--faint); }
  .tr.sel::before { background:var(--ink); }
  .tr .when { flex:0 0 62px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .tr .kind { flex:0 0 54px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; font-size:10px; }
  .tr .path { flex:1; }
  .tr .arrow { color:var(--faint); }
  .tr .verdict { letter-spacing:.06em; font-size:10.5px; }
  .tr.success .verdict { color:var(--ok); }      .tr.success::before { background:var(--ok); }
  .tr.failure .verdict, .tr.timeout .verdict { color:var(--stop); }
  .tr.failure::before, .tr.timeout::before { background:var(--stop); }
  .tr.blocked .verdict { color:var(--run); }      .tr.blocked::before { background:var(--run); }
  .tr.running .verdict { color:var(--run); }      .tr.running::before { background:var(--run); animation:pulse 1.1s ease-in-out infinite; }
  /* Killed, not failed: it never reached a verdict. */
  .tr.interrupted .verdict { color:var(--faint); font-style:italic; }
  .tr.interrupted::before { background:transparent; box-shadow:inset 0 0 0 1px var(--faint); }

  /* The agent's own plan, kept current: the log says what happened, this says
     what it thinks is left. Sticky, because a plan mid-flight is only useful
     at its latest state — the history of how it got there is already in the
     log, as a terse TodoWrite line per update. */
  .todos {
    flex:0 0 auto; padding:10px 18px; border-bottom:1px solid var(--rule);
    font-size:11.5px; line-height:1.6;
  }
  .todo { display:flex; gap:8px; align-items:baseline; }
  .todo .mark { flex:0 0 1.1em; text-align:center; }
  .todo.completed { color:var(--faint); text-decoration:line-through; }
  .todo.completed .mark { color:var(--ok); }
  .todo.in_progress { color:var(--ink); font-weight:500; }
  .todo.in_progress .mark { color:var(--run); }
  .todo.pending .mark { color:var(--faint); }

  .log {
    margin:0; flex:1 1 auto; min-height:0; overflow:auto; padding:14px 18px;
    font-size:11.5px; line-height:1.7; color:var(--dim);
  }
  /* Loading/empty/error read as one line of text, not as log content, so they
     are their own element rather than the `:empty::after` trick — that trick
     could not tell "nothing fetched yet" from "fetched and genuinely blank"
     apart, which is exactly the distinction these states exist to draw. */
  .log .status, .history .slot { color:var(--faint); }
  .log .status.err, .history .slot.err {
    color:var(--stop); border-color:color-mix(in srgb, var(--stop) 40%, var(--rule-soft));
  }
  /* An indeterminate bar: one fetch of unknown length has no progress to
     report, so it sweeps rather than fills. */
  .log .status.loading::before, .history .slot.loading::before {
    content:""; display:block; height:2px; margin-bottom:8px;
    background:linear-gradient(90deg, transparent, var(--run), transparent);
    background-size:50% 100%; animation:loadbar 1.1s ease-in-out infinite;
  }
  @keyframes loadbar { 0%{background-position:-50% 0} 100%{background-position:150% 0} }
  .ln { white-space:pre-wrap; word-break:break-word; }
  .ln.blank { height:.55em; }
  /* stderr is where a script says something went wrong, and where the blocked
     convention is reported. It should not look like prose. */
  .ln.stderr { color:var(--stop); }
  .ln.engine { color:var(--run); font-style:italic; }
  /* A tool call is an event, not a sentence: the agent did something. */
  .ln.tool {
    color:var(--ink); margin:3px 0 3px -8px; padding-left:8px;
    border-left:2px solid var(--run);
  }
  .ln.tool .tname { color:var(--run); letter-spacing:.06em; }
  .ln.tool .targ { color:var(--dim); }
  .ln.head { color:var(--ink); font-weight:600; margin-top:9px; }
  .ln.rule { border-top:1px solid var(--rule-soft); margin:8px 0; height:0; }
  .ln .bullet { color:var(--faint); }
  .log code {
    background:color-mix(in srgb, var(--ink) 8%, transparent);
    color:var(--ink); padding:0 3px; border-radius:2px;
  }
  .log strong { color:var(--ink); font-weight:600; }

  /* ---- dialogs: the questions, and the final report ---------------------- */
  dialog {
    background:var(--panel); color:var(--ink); border:1px solid var(--rule); border-radius:10px;
    padding:0; width:min(760px, 94vw); box-shadow:0 40px 90px -30px rgba(0,0,0,.7);
  }
  dialog::backdrop { background:rgba(0,0,0,.55); backdrop-filter:blur(2px); }
  .askform { padding:20px 22px; display:flex; flex-direction:column; gap:14px; }
  .askhead { display:flex; gap:12px; align-items:baseline; }
  .askstep { color:var(--faint); font-size:11px; }
  .askhdr { color:var(--ask); font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
  .askq { margin:0; font-size:15px; line-height:1.55; white-space:pre-wrap; }
  .askopts { display:flex; flex-direction:column; gap:7px; }
  .askopt {
    display:flex; gap:11px; align-items:flex-start; padding:10px 13px; cursor:pointer;
    border:1px solid var(--rule); border-radius:8px; background:var(--raised);
  }
  .askopt:hover { border-color:var(--faint); }
  .askopt:has(input:checked) { border-color:var(--ask); background:color-mix(in srgb, var(--ask) 10%, var(--raised)); }
  .askopt input { margin:3px 0 0; accent-color:var(--ask); }
  .askopt b { display:block; font-weight:600; }
  .askopt small { display:block; color:var(--dim); font-size:12px; line-height:1.45; margin-top:2px; }
  .askother {
    width:100%; font:inherit; font-size:13px; background:var(--ground); color:var(--ink);
    border:1px solid var(--rule); border-radius:8px; padding:9px 11px;
  }
  .askother:focus { outline:none; border-color:var(--ask); }
  .askfoot { display:flex; gap:8px; align-items:center; }
  .askfoot .send { color:#fff; background:var(--ask); border-color:transparent; }
  .rhead {
    display:flex; gap:8px; align-items:center; padding:12px 16px;
    border-bottom:1px solid var(--rule); position:sticky; top:0; background:var(--panel);
  }
  .rhead b { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rbody { max-height:72vh; overflow:auto; padding:6px 22px 22px; border:0; }
  .rbody.report { font-size:13px; }
  #printout { display:none; }
  @media print {
    body.print-report { background:#fff; color:#000; }
    body.print-report > :not(#printout) { display:none !important; }
    body.print-report #printout {
      display:block; color:#000; background:#fff; padding:0; border:0;
      font-size:12px; line-height:1.5;
    }
    body.print-report #printout .report { color:#000; background:#fff; border:0; padding:0; }
    body.print-report #printout h1, body.print-report #printout h2,
    body.print-report #printout th, body.print-report #printout code,
    body.print-report #printout strong { color:#000; }
    body.print-report #printout code { background:#eee; }
    body.print-report #printout table { page-break-inside:auto; }
    body.print-report #printout tr { page-break-inside:avoid; }
    @page { margin:18mm; }
  }
  .rbody .slot { margin:14px 0; }

  /* ---- the design pass ----------------------------------------------------
     One voice. Sentence case everywhere, one sans family, mono only where the
     content is a readout — an id, a log line, a code span. Colour is state
     and nothing else: amber is working, violet is waiting on you, red is a
     fault, green is finished. The page is the height of the window and the
     line fills it, so the scrollbar is always where a scrollbar is. */
  body { display:flex; flex-direction:column; height:100vh; font-size:13px; }
  .mark, .readout, .count, .runs-label, .prio, .rank, .agent .who, .src-chip,
  .drow .dstatus, .why { font-family:var(--sans); }
  .src, .log, .ln, .stop .meta, .askstep, code { font-family:var(--mono); }

  .masthead { align-items:center; gap:14px; padding:11px 22px; }
  .mark { font-size:15px; font-weight:600; letter-spacing:0; text-transform:none; }
  .readout { font-size:12.5px; letter-spacing:0; white-space:nowrap; align-items:center; }
  .readout b { font-weight:600; }
  .ctl {
    font-size:12.5px; letter-spacing:0; text-transform:none; white-space:nowrap;
    padding:6px 12px; border-radius:6px; color:var(--ink);
    border-color:var(--rule); background:var(--raised);
  }
  .ctl:hover:not(:disabled) { border-color:var(--faint); background:var(--panel); }
  .ctl.primary { background:var(--ink); color:var(--ground); border-color:transparent; font-weight:600; }
  .ctl.primary:hover:not(:disabled) { background:var(--ink); opacity:.9; }

  .needs, .agents, .sources { padding:8px 22px; font-size:12.5px; }
  .agent .who { font-size:12.5px; letter-spacing:0; text-transform:none; font-weight:600; }
  .agent .held { font-size:11.5px; border-radius:999px; padding:0 8px; }
  .src-chip .swatch { width:8px; height:8px; border-radius:50%; }
  .src-chip .n { color:var(--dim); }

  .rail-wrap { flex:1; min-height:0; }
  .line { height:100%; overflow:auto; padding:18px 22px 22px; }
  .railctl { display:none !important; }
  :root { --station:262px; }
  .station { padding-right:12px; }
  .station::after { display:none; }
  .plate {
    position:sticky; top:0; z-index:2; height:auto; padding:10px 12px 9px;
    background:var(--panel); border:1px solid var(--rule); border-radius:10px 10px 0 0;
    box-shadow:none;
  }
  .station.live .plate, .station.live .plate { border-color:var(--rule); box-shadow:inset 0 2px 0 var(--run); }
  .name { font-size:13px; font-weight:600; letter-spacing:0; text-transform:none; }
  .count { font-size:11.5px; color:var(--dim); background:var(--raised); border-radius:999px; padding:0 8px; }
  .count .held { color:var(--stop); }
  .runs-label { font-size:11.5px; letter-spacing:0; margin-top:2px; }
  .runs-label b { color:var(--dim); }
  .queue {
    margin:0; padding:8px; gap:6px; min-height:72px;
    background:var(--panel); border:1px solid var(--rule); border-top:0; border-radius:0 0 10px 10px;
  }
  .station.live .queue { border-top-color:transparent; }
  .queue .slot { border:0; padding:22px 8px; text-align:center; color:var(--faint); font-size:12px; }
  .terminus { margin-left:22px; padding-right:12px; }
  /* `overflow:hidden` so a long stage name or a wide tally clips instead of
     forcing the column wider — `min-width:0` alone stops the column growing,
     but leaves the plate's own content free to paint past its edge. */
  .terminus .plate { min-width:0; overflow:hidden; box-shadow:inset 0 2px 0 var(--ok); border-color:var(--rule); }
  .terminus .queue { border-top-color:transparent; }
  .terminus .name { color:var(--ink); }
  .more { border-radius:6px; padding:8px; }

  .item {
    border:1px solid var(--rule); border-left:1px solid var(--rule); border-radius:8px;
    padding:10px 12px; background:var(--raised);
  }
  .item:hover { border-color:var(--faint); }
  .item .title { font-size:13px; line-height:1.4; }
  /* The footer wraps rather than overflows: a long id ("caravan-v2:123")
     beside a chip is wider than a column. The open-link sits in the card's
     corner so it is never the thing that wraps onto a line of its own. */
  .item { position:relative; }
  .item .title { display:block; padding-right:18px; }
  .item .foot { margin-top:8px; gap:6px 8px; font-size:11.5px; letter-spacing:0; color:var(--dim); flex-wrap:wrap; min-width:0; }
  .item .foot > * { flex:none; max-width:100%; }
  .item .why { flex:0 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .src { white-space:nowrap; }
  .item .open { position:absolute; top:7px; right:7px; margin:0; border:0; color:var(--faint); }
  .item .open:hover { color:var(--ink); }
  .count .asks { color:var(--ask); }
  .src { color:var(--dim); }
  .src::before {
    content:""; display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--src, var(--faint)); margin-right:6px; vertical-align:0;
  }
  .rank { border-radius:999px; padding:0 7px; }
  .open { border-radius:6px; padding:0 6px; }
  .working-tag { font-size:11.5px; letter-spacing:0; text-transform:none; font-weight:600; }
  .item .why { font-size:11.5px; letter-spacing:0; text-transform:none; padding:1px 9px; }
  .item.blocked { border-color:color-mix(in srgb, var(--stop) 45%, var(--rule)); }
  .item.blocked.waiting { border-color:var(--rule); }
  .item.blocked.asks { box-shadow:none; }
  .item .refused { font-size:11.5px; }

  aside { width:min(760px, 96vw); }
  .ahead { padding:14px 20px; align-items:center; }
  .ahead h2 { font-size:15px; font-weight:600; line-height:1.4; }
  .ahead .sub { font-size:12px; letter-spacing:0; text-transform:none; color:var(--dim); }
  .stop { border-radius:8px; border-left-width:3px; margin:12px 20px 0; }
  .stop h3 { font-size:12.5px; font-weight:600; letter-spacing:0; text-transform:none; }
  .stop p { font-size:13px; }
  .stop .hand { font-size:12px; letter-spacing:0; text-transform:none; border-radius:6px; padding:6px 12px; }
  .stop .answer { border-radius:6px; font-size:13px; }
  .stop.asks .hand { color:var(--ask); border-color:color-mix(in srgb, var(--ask) 45%, var(--rule)); }
  .stop.asks .hand:hover { background:color-mix(in srgb, var(--ask) 14%, transparent); }
  .stop.waiting .hand { color:var(--dim); border-color:var(--rule); }
  .report-head { padding:10px 20px 0; }
  .report { font-size:13px; }
  .report h1 { font-size:15px; font-weight:600; }
  .report h2 { font-size:13px; font-weight:600; letter-spacing:0; text-transform:none; margin-top:16px; }
  .report th { letter-spacing:0; text-transform:none; }
  .drow .dstatus { font-size:11.5px; letter-spacing:0; text-transform:none; }
  .askhdr { font-size:12.5px; letter-spacing:0; text-transform:none; }
  .doctor-sweep { margin:0 22px 10px; }
  @media (max-width: 640px) {
    body { height:auto; min-height:100vh; }
    .line { height:auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation:none !important; transition:none !important; }
  }
  @media (max-width: 640px) {
    :root { --station: 200px; }
    .masthead { flex-wrap:wrap; gap:10px; }
  }
</style>
</head>
<body>

<div class="masthead">
  <img class="glyph" src="/icon.svg" width="22" height="22" alt="">
  <span class="mark">Conveyor</span>
  <span class="readout">
    <span><span class="lamp" id="lamp"></span></span>
    <span id="line1">connecting</span>
  </span>
  <span class="grow"></span>
  <button class="ctl" id="notify" hidden>Notify me</button>
  <button class="ctl" id="unblock-all" hidden>Unblock all</button>
  <button class="ctl" id="diagnose" hidden>Diagnose</button>
  <button class="ctl" id="refresh">Refresh</button>
  <button class="ctl primary" id="tick">Tick once</button>
</div>

<div class="needs" id="needs"></div>
<div id="agents"></div>
<div id="sources"></div>
<div id="faults"></div>
<div id="doctor"></div>
<div class="rail-wrap">
  <div class="line" id="line"><div class="rail" id="rail"></div></div>
  <div class="railctl" id="railctl" hidden>
    <button class="railbtn" id="rail-left" aria-label="Scroll the line left">‹</button>
    <div class="railtrack" id="rail-track" role="scrollbar" aria-orientation="horizontal"
        aria-controls="line" tabindex="0" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="railthumb" id="rail-thumb"></div>
    </div>
    <button class="railbtn" id="rail-right" aria-label="Scroll the line right">›</button>
  </div>
</div>

<dialog id="ask"></dialog>
<dialog id="reportdlg"></dialog>
<div id="printout" class="report"></div>
<div class="scrim" id="scrim"></div>
<aside id="panel" aria-hidden="true">
  <div class="ahead">
    <div style="flex:1">
      <h2 id="ptitle">—</h2>
      <div class="sub" id="psub"></div>
    </div>
    <button class="ctl" id="close">Close</button>
  </div>
  <div class="upper" id="upper">
    <div id="stop"></div>
    <div class="report" id="report"></div>
    <div class="history" id="history" aria-live="polite"></div>
  </div>
  <div class="todos" id="todos" hidden></div>
  <div class="log" id="log" aria-live="polite"></div>
</aside>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let state = null, openItemId = null, followRun = null;
// Dragging ends in a click; without this, dropping a card also opens it.
let dragging = null, justDragged = false;
// Why each marked item is marked, keyed by item id — the engine's note, not the
// provider's. See State.Blocks.
let blocks = {};
const clock = iso => { const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); };

async function load() {
  try {
    state = await (await fetch("/api/state")).json();
    draw();
  } catch { fault("disconnected"); }
}

function fault(msg) { $("#lamp").className = "lamp down"; $("#line1").textContent = msg; }

// The doctor's own sweep, drawn separately from /api/state: it outlives any
// one poll and has to keep showing rows settle while a sweep is running,
// whether or not anything else on the board changed.
let doctorSweep = null;
async function loadDoctor() {
  try { doctorSweep = await (await fetch("/api/doctor")).json(); } catch { return; }
  drawDoctor();
}

function drawDoctor() {
  const box = $("#doctor");
  const sw = doctorSweep;
  if (!sw || !(sw.results || []).length) { box.innerHTML = ""; return; }
  // A dry run is never worded as a change: "would clear/leave", not "cleared",
  // and the head says outright that nothing happened yet.
  const verb = { cleared: sw.apply ? "cleared" : "would clear", left: sw.apply ? "left" : "would leave",
    failed: "failed", skipped: "skipped", pending: "pending" };
  box.innerHTML = `<div class="doctor-sweep">
      <div class="dhead">
        <b>Diagnose</b>
        <span class="${sw.apply ? "dapply" : "dstate"}">${sw.apply ? "applying" : "dry run — nothing changed yet"}</span>
        <span class="dstate">${sw.running ? "running…" : "finished"}</span>
        ${(!sw.running && !sw.apply) ? `<button class="ctl" id="doctor-apply">Apply</button>` : ""}
      </div>
      ${sw.results.map(r => `<div class="drow ${esc(r.status)}">
        <span class="ditem">${esc(r.item)}</span>
        <span class="dstatus">${esc(verb[r.status] || r.status)}</span>
        <span class="dwhy">${esc(r.why || "")}</span>
      </div>`).join("")}
    </div>`;
  const applyBtn = $("#doctor-apply");
  if (applyBtn) applyBtn.onclick = () => startDoctor(true);
}

async function startDoctor(apply) {
  const res = await fetch("/api/doctor", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ apply }),
  });
  if (res.status === 409) { alert("A sweep is already running."); return; }
  loadDoctor();
}

let firstDraw = true;
function draw() {
  if (!state) return;
  if (firstDraw) { firstDraw = false; queueMicrotask(openFromHash); }
  const stages = state.stages || [], items = state.items || [];
  indexSources(state.sources);
  // A list, because stages run in parallel: one entry per transition in flight.
  const active = state.active || [];
  const workingOn = id => active.find(a => a.itemId === id);
  blocks = state.blocks || {};

  // Items arrive in the order the scheduler will work them, so the board does
  // not sort: it draws them in the order it is given. A card's position is the
  // claim it makes, and re-deriving that here would be a second copy of rules
  // that live in the engine, free to disagree with it.
  const bucket = {};
  for (const st of stages) bucket[st.name] = [];
  for (const it of items) {
    // The item list is from the last poll; `active` is from now. An item being
    // worked has already been moved, so show it in the stage it is being worked
    // in — otherwise it sits in its old column flagged as working, which is
    // true of two different moments and reads as a bug.
    const a = workingOn(it.id);
    (bucket[a ? a.stage : it.stage] ||= []).push(it);
  }
  // The line runs through the working stages; terminal ones leave it.
  const flow = stages.filter(s => !s.terminal);
  const ends = stages.filter(s => s.terminal);

  $("#rail").innerHTML =
    flow.map(st => station(st, bucket[st.name] || [], active)).join("") +
    ends.map(st => terminus(st, bucket[st.name] || [])).join("");

  // What each agent says about itself. The engine passes this through — which
  // limits an agent has and what counts against them is the agent's business —
  // so the page renders whatever labels came back, in the order they came.
  // Being limited and being paused are two different facts and the strip says
  // both: the first is what the agent reports about itself, the second is what
  // the scheduler is doing about it. They usually agree, but the first refused
  // run pauses an agent a whole poll before its status script catches up — and
  // a paused line and an idle line look identical without this.
  const paused = Object.fromEntries((state.paused || []).map(p => [p.agent, p]));
  $("#agents").innerHTML = !(state.agents || []).length ? "" :
    `<div class="agents">${state.agents.map(a => {
      const facts = (a.detail || []).map(d =>
        `<span><b>${esc(d.label)}</b> ${esc(d.value)}</span>`).join("");
      const say = a.error ? `cannot say — ${esc(a.error)}` : esc(a.summary || "");
      const hold = paused[a.name];
      return `<span class="agent ${esc(a.state || "unknown")}${hold ? " paused" : ""}">
        <span class="lamp ${a.state === "limited" || hold ? "down" : a.state === "ok" ? "idle" : ""}"></span>
        <span class="who">${esc(a.name)}</span>
        <span class="say">${say}</span>
        ${hold ? `<span class="held">holding work back${hold.until ? ` until ${esc(clock(hold.until))}` : ""}</span>` : ""}
        ${a.resetsAt ? `<span class="resets">resets ${esc(clock(a.resetsAt))}</span>` : ""}
        ${facts ? `<details><summary>details</summary><span class="facts">${facts}</span></details>` : ""}
      </span>`;
    }).join("")}</div>`;

  // Handing the whole board back is the answer to one situation — the thing
  // that stopped everything is fixed — so the control only exists then.
  const marked = items.filter(it => it.blocked).length;
  const asking = items.filter(it => it.blocked && (blocks[it.id] || {}).asked);
  $("#needs").innerHTML = !asking.length ? "" :
    `<span class="nlabel">${asking.length} need${asking.length === 1 ? "s" : ""} your decision</span>` +
    asking.map(it => `<button class="need" data-id="${esc(it.id)}" data-title="${esc(it.title)}"
      data-stage="${esc(it.stage)}" title="${esc(it.title)}">${esc(it.title)}</button>`).join("");
  const all = $("#unblock-all");
  all.hidden = !marked;
  all.textContent = `Unblock all (${marked})`;
  // Diagnose reads a reason before acting, so it is offered wherever a mark
  // exists to read — the same condition as the blunter Unblock all.
  $("#diagnose").hidden = !marked;

  // A key for the edge colours, and the list of what is enrolled: without it
  // the colours are decoration, because nothing says which repo is which.
  const counts = {};
  for (const it of items) counts[it.source] = (counts[it.source] || 0) + 1;
  $("#sources").innerHTML = `<div class="sources">${
    (state.sources || []).map(s => {
      const broken = (s.problems || []).length > 0;
      return `<span class="src-chip${broken ? " broken" : ""}" style="--src:${sourceColour(s.name)}"
          title="${esc(s.workdir || "")}">
        <span class="swatch"></span>
        <span class="name">${esc(s.name)}</span>
        <span class="n">${counts[s.name] || 0}</span>
        ${broken ? `<span class="repo">cannot run</span>` : ""}
      </span>`;
    }).join("")
  }</div>`;

  const bad = (state.sources || []).filter(s => (s.problems || []).length);
  $("#faults").innerHTML = bad.length ? `<div class="faults">
      <h2>${bad.length} source${bad.length > 1 ? "s" : ""} cannot run</h2>
      ${bad.map(s => `<div><b>${esc(s.name)}</b> — ${s.problems.map(esc).join("<br>")}</div>`).join("")}
    </div>` : "";

  $("#lamp").className = "lamp " + (active.length || state.polling ? "busy" : "idle");
  const when = state.updatedAt ? new Date(state.updatedAt).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "—";
  const held = marked;
  $("#line1").innerHTML = active.length === 1
    ? `<b>${esc(active[0].stage)}</b> running &middot; ${esc(active[0].itemId)}`
    : active.length
      ? `<b>${active.length}</b> running &middot; ${active.map(a => esc(a.stage)).join(", ")}`
      : `<b>${items.length}</b> items${asking.length ? `, <b>${asking.length}</b> need${asking.length === 1 ? "s" : ""} you`
          : held ? `, <b>${held}</b> stopped` : ""} &nbsp;·&nbsp; updated ${when}`;

  document.querySelectorAll(".item").forEach(el => {
    const open = () => { if (!justDragged) inspect(el.dataset.id, el.dataset.title, el.dataset.stage); };
    el.onclick = e => { if (!e.target.closest("a")) open(); };
    el.onkeydown = e => {
      if ((e.key === "Enter" || e.key === " ") && !e.target.closest("a")) { e.preventDefault(); open(); }
    };
    wireDrag(el);
  });
  document.querySelectorAll(".queue[data-stage]").forEach(wireQueue);
  updateRailCtl();
}

// The rail's own horizontal scrollbar lives at its bottom edge, which on a
// busy board is off the bottom of the viewport — see #15. This control is
// pinned in the rail's top padding instead, so it is in view from the top of
// the page. It lives outside `.line` so re-rendering `#rail` (every state
// update) never touches it and never resets `.line`'s scrollLeft.
function lineMax() {
  const line = $("#line");
  return Math.max(line.scrollWidth - line.clientWidth, 0);
}

function updateRailCtl() {
  const line = $("#line"), ctl = $("#railctl"), track = $("#rail-track");
  // .line is the scroll container — its own scrollWidth includes its padding,
  // which is what scrollLeft is measured against. #rail's scrollWidth is the
  // flex row alone and undercounts that padding, so max would be reached
  // before the true end of the range.
  const overflow = line.scrollWidth > line.clientWidth + 1;
  ctl.hidden = !overflow;
  if (!overflow) return;
  const max = lineMax();
  const ratio = Math.max(line.clientWidth / line.scrollWidth, 0.06);
  $("#rail-thumb").style.width = `${ratio * 100}%`;
  $("#rail-thumb").style.left = `${(line.scrollLeft / max) * (1 - ratio) * 100}%`;
  $("#rail-left").disabled = line.scrollLeft <= 0;
  $("#rail-right").disabled = line.scrollLeft >= max - 1;
  track.setAttribute("aria-valuemax", String(Math.round(max)));
  track.setAttribute("aria-valuenow", String(Math.round(line.scrollLeft)));
}

function scrollRail(dir) {
  const line = $("#line");
  const max = lineMax();
  const step = Math.max(line.clientWidth * 0.8, 120);
  line.scrollLeft = Math.min(Math.max(line.scrollLeft + dir * step, 0), max);
  updateRailCtl();
}

// --- rail drag/click/wheel/keyboard -----------------------------------------
// The pinned control behaves like a real scrollbar: drag the thumb, click the
// track to jump, wheel over it, arrow keys when it has focus. Geometry is
// measured against `.line` (see updateRailCtl's comment above) so a drag
// never falls short of the true end.
function railGeometry() {
  const track = $("#rail-track");
  const trackRect = track.getBoundingClientRect();
  const line = $("#line");
  const ratio = Math.max(line.clientWidth / line.scrollWidth, 0.06);
  const thumbW = ratio * trackRect.width;
  return { trackRect, thumbW, travel: trackRect.width - thumbW, max: lineMax() };
}

function railScrollTo(t) {
  const { max } = railGeometry();
  $("#line").scrollLeft = Math.round(Math.min(Math.max(t, 0), 1) * max);
  updateRailCtl();
}

let railDrag = null;
function railTrackDown(e) {
  if (e.button !== undefined && e.button !== 0) return;
  const g = railGeometry();
  const clickX = e.clientX - g.trackRect.left;
  const thumbLeft = (g.max > 0 ? $("#line").scrollLeft / g.max : 0) * g.travel;
  const onThumb = clickX >= thumbLeft && clickX <= thumbLeft + g.thumbW;
  // Pointer travel maps to content travel by scrollableWidth / trackWidth
  // (g.max / g.travel), not 1:1 — grabbing the thumb preserves the offset
  // between the pointer and the thumb's own left edge, so it does not jump.
  const grabOffset = onThumb ? clickX - thumbLeft : g.thumbW / 2;
  railDrag = { pointerId: e.pointerId, grabOffset, travel: g.travel };
  $("#rail-track").setPointerCapture?.(e.pointerId);
  railScrollTo(g.travel > 0 ? (clickX - grabOffset) / g.travel : 0);
  e.preventDefault();
}
function railTrackMove(e) {
  if (!railDrag || e.pointerId !== railDrag.pointerId) return;
  const g = railGeometry();
  const x = e.clientX - g.trackRect.left - railDrag.grabOffset;
  railScrollTo(g.travel > 0 ? x / g.travel : 0);
}
function railTrackUp(e) {
  if (!railDrag || (e && e.pointerId !== undefined && e.pointerId !== railDrag.pointerId)) return;
  railDrag = null;
}
const railTrackEl = () => $("#rail-track");
railTrackEl().addEventListener("pointerdown", railTrackDown);
railTrackEl().addEventListener("pointermove", railTrackMove);
railTrackEl().addEventListener("pointerup", railTrackUp);
railTrackEl().addEventListener("pointercancel", railTrackUp);
railTrackEl().addEventListener("lostpointercapture", railTrackUp);
// A drag keeps tracking the pointer past the track's own box — above, below,
// or outside the window — because it is captured, not because it is still
// inside the element; these two cover a mouseup while the OS still has the
// button down but the tab lost focus (alt-tab mid-drag).
addEventListener("blur", () => { railDrag = null; });
addEventListener("visibilitychange", () => { if (document.hidden) railDrag = null; });

railTrackEl().addEventListener("keydown", e => {
  if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
  e.preventDefault();
  const line = $("#line"), max = lineMax();
  const step = Math.max(line.clientWidth * 0.1, 24);
  if (e.key === "ArrowLeft") line.scrollLeft = Math.max(line.scrollLeft - step, 0);
  else if (e.key === "ArrowRight") line.scrollLeft = Math.min(line.scrollLeft + step, max);
  else if (e.key === "Home") line.scrollLeft = 0;
  else if (e.key === "End") line.scrollLeft = max;
  updateRailCtl();
});

// Normalise a wheel notch across deltaMode 0 (pixels), 1 (lines), 2 (pages) to
// a roughly comparable pixel distance, so one notch of a normal mouse wheel
// moves the rail by a similar amount in each. Page mode is rare — the few
// devices that report it send one page (deltaY 1) per notch, and a "page" of
// the rail is easily thousands of pixels wide, so scaling by the rail's own
// width would move it by an entire screen for the same physical gesture that
// moves a handful of lines under mode 1. 120px keeps it on the same order as
// a mode-0 notch instead.
function wheelPixels(e) {
  if (e.deltaMode === 1) return e.deltaY * 16;
  if (e.deltaMode === 2) return e.deltaY * 120;
  return e.deltaY;
}

// A plain vertical wheel over the rail (or the pinned control) scrolls it
// horizontally while it has range left in that direction; at either end the
// event is left alone so the page scrolls instead — the board never swallows
// vertical scrolling at the ends of its range (#15). Only consumed when it
// actually moves the rail, which is what makes that release work and is why
// this cannot be a passive listener. Shift+wheel and a diagonal trackpad
// gesture are left to the browser entirely, so the two never double-apply.
function railWheel(e) {
  if (e.shiftKey) return;
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  const line = $("#line"), max = lineMax();
  if (max <= 0) return;
  const px = wheelPixels(e);
  if (px < 0 && line.scrollLeft <= 0) return;
  if (px > 0 && line.scrollLeft >= max - 0.5) return;
  e.preventDefault();
  line.scrollLeft = Math.min(Math.max(line.scrollLeft + px, 0), max);
  updateRailCtl();
}
$("#line").addEventListener("wheel", railWheel, { passive: false });
$("#railctl").addEventListener("wheel", railWheel, { passive: false });

// Tracks a geometry change that fires no `resize` event at all: browser zoom,
// a font loading late, or `--station` changing at the 640px media query.
// `.line` is `overflow-x:auto`, so its own box does not move when only its
// content's width changes — a font finishing load after the first render
// grows `#rail`'s scrollWidth without touching `.line`'s box at all, so both
// are observed: `#rail` for content-width changes, `.line` for the container
// itself (zoom, `--station`).
const railResize = new ResizeObserver(updateRailCtl);
railResize.observe($("#line"));
railResize.observe($("#rail"));

function station(st, items, active) {
  const live = active.some(a => a.stage === st.name);
  return `<section class="station${live ? " live" : ""}">
    <div class="plate">
      <div class="name">${esc(st.name)}${tally(items)}</div>
      <div class="runs-label">${st.script ? `runs <b>${esc(st.script)}</b>` : st.runs ? "runs a script" : "waits"}</div>
    </div>
    <div class="queue" data-stage="${esc(st.name)}">${
      items.length ? items.map((it, i) => card(it, active, i)).join("")
                   : `<div class="slot">Nothing here</div>`}</div>
  </section>`;
}

// Ten at a time: a done column is a ledger, and the last ten entries are the
// ones anyone reads. The rest are one press away. Per column, kept across
// redraws so an SSE update does not fold the list back up mid-read.
const shown = {};
function terminus(st, items) {
  const n = shown[st.name] || 10;
  const left = items.length - n;
  return `<section class="terminus">
    <div class="plate">
      <div class="name">${esc(st.name)}${tally(items)}</div>
      <div class="runs-label">Finished</div>
    </div>
    <div class="queue">${items.slice(0, n).map(it => card(it, [], null)).join("")}${
      left > 0 ? `<button class="more" data-stage="${esc(st.name)}">Show ${Math.min(10, left)} more · ${left} older</button>` : ""}</div>
  </section>`;
}
document.addEventListener("click", e => {
  const more = e.target.closest(".more");
  if (more) { shown[more.dataset.stage] = (shown[more.dataset.stage] || 10) + 10; draw(); return; }
  const need = e.target.closest(".need");
  if (need) inspect(need.dataset.id, need.dataset.title, need.dataset.stage);
});

// How many are here, and how many of those are not moving. Blocked is no longer
// a column to look at, so the count is where a stage says it is holding
// something a person has to deal with.
function tally(items) {
  const asks = items.filter(it => it.blocked && (blocks[it.id] || {}).asked).length;
  const held = items.filter(it => it.blocked).length - asks;
  return `<span class="count">${items.length}${
    asks ? ` &middot; <span class="asks">${asks} need${asks === 1 ? "s" : ""} you</span>` : ""}${
    held ? ` &middot; <span class="held">${held} stopped</span>` : ""}</span>`;
}

function card(it, active, place) {
  // Number, or nothing. `undefined !== null` is true, so a missing argument
  // used to render "NaN" in the rank badge rather than omitting it.
  const ranked = Number.isInteger(place);
  const hasPrio = it.priority !== null && it.priority !== undefined;
  const working = active.some(a => a.itemId === it.id);
  const cls = ["item", hasPrio ? "p" + it.priority : "", working ? "working" : "",
               it.blocked ? "blocked " + tone(blocks[it.id]) : "", ranked ? "ranked" : ""].filter(Boolean).join(" ");
  return `<article class="${cls}" draggable="true" tabindex="0" role="button"
      style="--src:${sourceColour(it.source)}"
      data-id="${esc(it.id)}" data-title="${esc(it.title)}" data-stage="${esc(it.stage)}">
    <span class="title">${esc(it.title)}</span>
    <span class="foot">
      ${working ? `<span class="working-tag">working</span>` : ""}
      ${it.blocked ? why(it) : ""}
      ${ranked && !working && !it.blocked ? `<span class="rank">${place + 1}</span>` : ""}
      ${hasPrio ? `<span class="prio">p${it.priority}</span>` : ""}
      <span class="src">${esc(it.id)}</span>
      ${it.url ? `<a class="open" href="${esc(it.url)}" target="_blank" rel="noopener"
           title="Open on GitHub" aria-label="Open ${esc(it.id)} on GitHub">&#8599;</a>` : ""}
    </span>
    ${refusals.has(it.id) ? `<span class="refused">${esc(refusals.get(it.id))}</span>` : ""}
  </article>`;
}

// What kind of stop it was, in one word, and nothing else. The reason is a
// paragraph and belongs in the panel: a column of paragraphs is a column you
// cannot read across, and reading across is what a board is for. Telling "out
// of quota" from "someone has to decide something" at a glance is the whole job
// here — the click is for the rest.
function why(it) {
  const b = blocks[it.id] || {};
  return `<span class="why ${tone(b)}">${b.asked ? "needs you · " : ""}${esc(b.kind || "blocked")}</span>`;
}

// Three tones, from the two facts the engine carries: a question is `asked`,
// and these kinds are conditions that pass on their own (agents/_blocked's
// vocabulary — presentation only, the engine never reads the word). Anything
// else stopped because something went wrong.
const WAITING = new Set(["limit", "turns", "unfinished", "dependency", "worktree"]);
function tone(b) {
  b = b || {};
  return b.asked ? "asks" : WAITING.has(b.kind) ? "waiting" : "fault";
}

// The questions an agent left beside its reason, if they are the shape the
// modal can walk; anything else is shown as the paragraph it always was.
function questionsOf(b) {
  const qs = b && b.questions;
  return Array.isArray(qs) && qs.length && qs.every(q => q && typeof q === "object") ? qs : null;
}

// One hue per source, spread evenly around the wheel rather than hashed from
// the name: hashing put midgame, quesshi and caravan-v2 within 21 degrees of
// each other, which reads as one colour. Position gives maximal separation for
// however many sources there are.
//
// The span starts past the reds and ambers so a repository's identity can never
// be mistaken for a failure or for work in progress.
let hueOf = new Map();
function indexSources(sources) {
  hueOf = new Map((sources || []).map((s, i, all) =>
    [s.name, `hsl(${Math.round(95 + (i * 260) / Math.max(all.length, 1))} 55% 60%)`]));
}
const sourceColour = name => hueOf.get(name) || "var(--faint)";

async function inspect(id, title, stage) {
  openItemId = id;
  // No run is selected yet: an SSE line for whatever was open before this
  // must not paint into a panel that has moved on to a different item.
  followRun = null; logPending = false; logBuffer = [];
  $("#ptitle").textContent = title || id;
  $("#psub").textContent = `${id} · ${stage}`;
  $("#panel").classList.add("open"); $("#panel").setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("open");
  setLogStatus("loading", "Loading…");
  $("#todos").innerHTML = ""; $("#todos").hidden = true;
  $("#stop").innerHTML = stopNotice(id);
  const hand = $("#stop").querySelector(".hand");
  if (hand) hand.onclick = () => handBack(id, hand);
  const askBtn = $("#stop").querySelector(".ask-btn");
  if (askBtn) askBtn.onclick = () => openAsk(id, title);
  // The report is derived from run history, so it exists for every item;
  // on one still moving it is the passage so far.
  const label = stageBy(stage)?.terminal ? "Final report" : "Report so far";
  $("#report").innerHTML = `<div class="report-head"><button class="ctl rbtn" data-label="${label}">${label}</button></div>`;
  $("#report .rbtn").onclick = e => openReport(id, title, e.target);
  await loadHistory(id);
}

// The final report, in a modal: rendered, with the markdown one press away as
// a copy, a file, or the browser's own print-to-PDF. Derived fresh on every
// open, never cached, because it thins as retention sweeps the runs it is
// built from.
async function openReport(id, title, btn) {
  // The dialog opens at once and says it is loading: the report is derived
  // by walking run history, which on a busy board is seconds, and a button
  // that does nothing for seconds gets pressed again.
  const dlg = $("#reportdlg");
  const head = (ready) => `<div class="rhead"><b>${esc(title || id)}</b><span class="grow"></span>
      ${ready ? `<button class="ctl" data-act="copy">Copy markdown</button>
      <button class="ctl" data-act="md">Download .md</button>
      <button class="ctl" data-act="print">Print / PDF</button>` : ""}
      <button class="ctl" data-act="close">Close</button></div>`;
  dlg.innerHTML = `${head(false)}<div class="report rbody"><div class="slot loading">Building the report from run history…</div></div>`;
  dlg.onclick = e => { if (e.target.dataset?.act === "close" || e.target === dlg) dlg.close(); };
  if (!dlg.open) dlg.showModal();
  if (btn) { btn.disabled = true; btn.textContent = "Loading…"; }
  let md;
  try {
    const res = await fetch(`/api/items/${encodeURIComponent(id)}/report`);
    if (!res.ok) {
      dlg.querySelector(".rbody").innerHTML = `<div class="slot err">${esc((await res.text()).trim() || "no report")}</div>`;
      return;
    }
    md = await res.text();
  } catch (err) {
    dlg.querySelector(".rbody").innerHTML = `<div class="slot err">could not load the report: ${esc(String(err))}</div>`;
    return;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = btn.dataset.label || "Report"; }
  }
  if (!dlg.open) return; // closed while it loaded
  dlg.innerHTML = `${head(true)}<div class="report rbody">${mdToHTML(md)}</div>`;
  dlg.onclick = async e => {
    const act = e.target.dataset && e.target.dataset.act;
    if (!act) { if (e.target === dlg) dlg.close(); return; }
    if (act === "close") dlg.close();
    if (act === "copy") {
      try { await navigator.clipboard.writeText(md); e.target.textContent = "Copied"; }
      catch { e.target.textContent = "Could not copy"; }
      setTimeout(() => { e.target.textContent = "Copy markdown"; }, 1500);
    }
    if (act === "md") {
      const url = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
      const a = document.createElement("a");
      a.href = url; a.download = `${id.replace(/[^\w.-]+/g, "-")}-report.md`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    if (act === "print") {
      // Printed from a plain block in the page, never from the dialog: a
      // modal is fixed to the viewport and clipped to it by the browser's
      // own stylesheet, which prints as one page with a scrollbar. The class
      // hides everything else, and the browser's dialog offers "Save as PDF".
      const out = $("#printout");
      out.innerHTML = mdToHTML(md);
      document.body.classList.add("print-report");
      addEventListener("afterprint", () => {
        document.body.classList.remove("print-report");
        out.innerHTML = "";
      }, { once: true });
      window.print();
    }
  };
  dlg.showModal();
}

// The questions, one at a time, exactly as AskUserQuestion would have put
// them to you: a header, the question, options with what each means, and a
// line for anything else. The answers go back as one reply into the
// conversation that asked, via the same endpoint the textarea uses.
function openAsk(id, title) {
  const qs = questionsOf(blocks[id]);
  if (!qs) return;
  const dlg = $("#ask");
  const answers = [];
  let i = 0;
  const show = () => {
    const q = qs[i], opts = Array.isArray(q.options) ? q.options : [];
    const type = q.multiSelect ? "checkbox" : "radio";
    dlg.innerHTML = `<form class="askform" method="dialog">
      <div class="askhead">
        <span class="askstep">${i + 1} / ${qs.length}</span>
        <span class="askhdr">${esc(q.header || "")}</span>
        <span class="grow"></span>
        <span class="askstep">${esc(title || id)}</span>
      </div>
      <p class="askq">${esc(q.question || q.header || "")}</p>
      <div class="askopts">${opts.map((o, j) => `<label class="askopt">
          <input type="${type}" name="o" value="${j}">
          <span><b>${esc(o.label || "")}</b>${o.description ? `<small>${esc(o.description)}</small>` : ""}</span>
        </label>`).join("")}
        <input class="askother" type="text" placeholder="${opts.length ? "Or say it in your own words" : "Your answer"}">
      </div>
      <div class="askfoot">
        <button type="button" class="ctl" data-act="cancel">Cancel</button>
        <span class="grow"></span>
        ${i ? `<button type="button" class="ctl" data-act="back">Back</button>` : ""}
        <button type="submit" class="ctl send">${i + 1 < qs.length ? "Next" : "Send answers"}</button>
      </div></form>`;
    const form = dlg.querySelector("form");
    form.onclick = e => {
      const act = e.target.dataset && e.target.dataset.act;
      if (act === "cancel") dlg.close();
      if (act === "back") { i--; show(); }
    };
    form.onsubmit = e => {
      e.preventDefault();
      const picked = [...form.querySelectorAll("input[name=o]:checked")].map(x => opts[+x.value].label);
      const other = form.querySelector(".askother").value.trim();
      if (!picked.length && !other) { form.querySelector(".askother").focus(); return; }
      answers[i] = `${q.header || `Q${i + 1}`}: ${[...picked, other].filter(Boolean).join(" — ")}`;
      if (++i < qs.length) { show(); return; }
      dlg.close();
      const box = document.querySelector("#stop .answer");
      const note = box ? box.value.trim() : "";
      sendAnswer(id, answers.join("\n") + (note ? `\n\n${note}` : ""));
    };
  };
  show();
  dlg.showModal();
}

async function sendAnswer(id, answer) {
  const btn = document.querySelector("#stop .ask-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Sending…"; }
  const res = await fetch(`/api/items/${encodeURIComponent(id)}/unblock`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ answer }),
  });
  if (!res.ok) { refuse(id, (await res.text()).trim() || `could not answer ${id}`); return; }
  $("#stop").innerHTML = "";
}

// A small markdown-to-elements reader for the one document this board
// generates itself: headings, tables, bullets and blockquotes, each drawn as
// its own element rather than one preformatted blob — reusing inline() for
// the `code` and `**bold**` inside them, so nothing in a repository's title
// or a script's summary can inject markup into the page.
function mdToHTML(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "", i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { html += `<h${h[1].length}>${paraInline(h[2])}</h${h[1].length}>`; i++; continue; }

    if (line.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) { rows.push(lines[i]); i++; }
      html += tableHTML(rows);
      continue;
    }

    if (line.startsWith(">")) {
      const quote = [];
      while (i < lines.length && lines[i].startsWith(">")) { quote.push(lines[i].replace(/^>\s?/, "")); i++; }
      html += `<blockquote>${quote.map(inline).join("<br>")}</blockquote>`;
      continue;
    }

    if (/^-\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^-\s+/.test(lines[i])) { items.push(lines[i].replace(/^-\s+/, "")); i++; }
      html += `<ul>${items.map(it => `<li>${paraInline(it)}</li>`).join("")}</ul>`;
      continue;
    }

    html += `<p>${paraInline(line)}</p>`;
    i++;
  }
  return html;
}

// A GFM pipe table, cells split on `|` while honouring the report's own
// escaping (`\|` for a literal pipe) so an item title containing one cannot
// widen or narrow a row.
function tableHTML(rows) {
  const split = row => {
    const inner = row.trim().replace(/^\||\|$/g, "");
    const out = [];
    let cur = "";
    for (let j = 0; j < inner.length; j++) {
      if (inner[j] === "\\" && inner[j + 1] === "|") { cur += "|"; j++; continue; }
      if (inner[j] === "|") { out.push(cur.trim()); cur = ""; continue; }
      cur += inner[j];
    }
    out.push(cur.trim());
    return out;
  };
  if (rows.length < 2) return "";
  const header = split(rows[0]);
  const body = rows.slice(2).map(split);
  return `<table><thead><tr>${header.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>
    <tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

// inline(), plus the one piece of syntax the report adds beyond it: an
// item's own `[text](url)` link, on the identity line. The server only ever
// emits that syntax for an http(s) URL (identityLine, report.go), but this
// reader runs over every heading and paragraph, not just that one line — so
// it re-checks the scheme itself before linking, the same rule the server
// applied, rather than trusting that no other text node can ever contain a
// bracket pair. A title or summary containing literal `[x](javascript:…)`
// therefore prints as text, not as a link that runs on click.
function paraInline(s) {
  const m = s.match(/^(.*)\[([^\]]+)\]\(([^)]+)\)(.*)$/);
  if (!m) return inline(s);
  const safe = /^https?:\/\//i.test(m[3]);
  const mid = safe
    ? `<a href="${esc(m[3])}" target="_blank" rel="noopener">${inline(m[2])}</a>`
    : inline(`[${m[2]}](${m[3]})`);
  return paraInline(m[1]) + mid + paraInline(m[4]);
}

// The whole reason, where there is room for it, and the control that answers
// it. Shown only for a marked item: everything else on the board is moving.
function stopNotice(id) {
  const b = blocks[id];
  if (!b) return "";
  const at = b.at ? new Date(b.at) : null;
  const qs = questionsOf(b);
  const t = tone(b);
  return `<div class="stop ${t}">
    <h3>${t === "asks" ? "needs you · " : t === "waiting" ? "waiting · " : ""}${esc(b.kind || "blocked")}${b.stage ? ` in ${esc(b.stage)}` : ""}</h3>
    <p>${esc(b.reason || "no reason was recorded")}</p>
    <div class="meta">
      ${at && !isNaN(at) ? `stopped ${esc(at.toLocaleString())}` : ""}
      ${b.runId ? ` &middot; run ${esc(b.runId)}` : ""}
    </div>
    ${qs ? `<button class="ask-btn">Answer ${qs.length === 1 ? "the question" : `${qs.length} questions`}</button>` : ""}
    <textarea class="answer" rows="3" spellcheck="true"
      placeholder="${qs ? "Anything to add beside the answers above, or reply here instead."
                       : t === "asks" ? "Your answer. The agent takes it up in the conversation that stopped."
                       : "Reply if there is something to say; leave it empty to just hand the item back."}"></textarea>
    <button class="hand"
      title="Clear the mark; the item goes straight back into the line">${t === "asks" ? "Send reply" : "Hand back"}</button>
  </div>`;
}

function setHistoryStatus(kind, text) {
  $("#history").innerHTML =
    `<div class="slot${kind === "error" ? " err" : kind === "loading" ? " loading" : ""}">${esc(text)}</div>`;
}

// A failed history fetch leaves no run to select — the log would otherwise
// sit on "Loading…" forever, an artifact with nothing left to resolve it.
function historyFailed(id, msg) {
  setHistoryStatus("error", msg);
  if (followRun === null) setLogStatus("idle", "");
}

// `openItemId === id` alone cannot tell apart the first open of an item from
// a later re-open of the same item — opening A, then B, then A again leaves
// two in-flight fetches that both satisfy that check, so the id equality
// used to matter but is not enough on its own to make the second one "the
// current one". `historyGen` is a call counter: only the fetch started by
// the most recent loadHistory() for the current item is allowed to render.
let historyGen = 0;

async function loadHistory(id) {
  const gen = ++historyGen;
  const stale = () => openItemId !== id || gen !== historyGen;
  setHistoryStatus("loading", "Loading…");
  let runs;
  try {
    const res = await fetch(`/api/runs?item=${encodeURIComponent(id)}`);
    // The panel may have moved on to another item, or a newer call for this
    // same item may already be in flight, while this was in flight.
    if (stale()) return;
    if (!res.ok) { historyFailed(id, `Could not load run history (HTTP ${res.status}).`); return; }
    runs = await res.json();
  } catch {
    if (stale()) return;
    historyFailed(id, "Could not load run history."); return;
  }
  if (stale()) return;
  if (!Array.isArray(runs)) { historyFailed(id, "Could not load run history."); return; }
  $("#history").innerHTML = runs.length ? runs.map(r => `
    <button class="tr ${esc(r.outcome)}" data-run="${esc(r.id)}">
      <span class="when">${esc((r.startedAt || "").slice(11, 19))}</span>
      <span class="kind">${esc(r.kind)}</span>
      <span class="path">${transition(r)}</span>
      <span class="verdict">${esc(r.outcome)}</span>
    </button>`).join("")
    : `<div class="slot">No runs yet.</div>`;
  document.querySelectorAll("#history [data-run]").forEach(b => b.onclick = () => showRun(b.dataset.run));
  if (runs.length) showRun(runs[0].id);
  // Never leave the log claiming "No output." for a run that was never
  // selected — an item that genuinely has no history reads as exactly that
  // in both regions.
  else { followRun = null; setLogStatus("idle", "No runs yet."); }
}

// A run whose from and to are the same stage is not a move. For a stage script
// it is a re-run of work that did not finish; for a provider write it is the
// engine confirming the item is where it already says it is. Printing
// "refining → refining" for both reads like a bug.
function transition(r) {
  const from = esc(r.from || ""), to = esc(r.to || "");
  if (!from && !to) return `<span class="arrow">poll</span>`;
  if (from === to) {
    return r.kind === "stage"
      ? `<span class="arrow">&#8635;</span> re-ran ${to}`
      : `<span class="arrow">&#8801;</span> confirmed ${to}`;
  }
  return `${from} <span class="arrow">&rarr;</span> ${to}`;
}

function setLogStatus(kind, text) {
  const log = $("#log");
  log.innerHTML = `<div class="status${kind === "error" ? " err" : kind === "loading" ? " loading" : ""}">${esc(text)}</div>`;
}

// SSE lines for the followed run that arrive while its own fetch is still in
// flight cannot just be appended — the snapshot they will land after has not
// rendered yet, and it may itself already carry the very same line. They are
// buffered here and joined once the snapshot is in, in appendBuffered().
// `logGen` scopes logPending/logBuffer to whichever showRun() call is current,
// so a superseded call finishing late cannot clear a newer call's buffer.
let logGen = 0, logPending = false, logBuffer = [];

async function showRun(id) {
  followRun = id;
  const gen = ++logGen;
  // `followRun === id` alone cannot tell apart the first click on a run from
  // a later re-click on the same run — A, then B, then A again leaves two
  // in-flight fetches that both satisfy that check. `gen` is what actually
  // orders the calls: only the fetch started by the most recent showRun()
  // is allowed to render or touch logPending/logBuffer.
  const stale = () => followRun !== id || gen !== logGen;
  logPending = true;
  logBuffer = [];
  document.querySelectorAll("#history [data-run]").forEach(b => b.classList.toggle("sel", b.dataset.run === id));
  setLogStatus("loading", "Loading…");
  let lines;
  try {
    const res = await fetch(`/api/runs/${id}`);
    // The reader moved to another run, closed the panel, or re-clicked this
    // same run again while this was in flight — nothing of this response
    // belongs on screen any more.
    if (stale()) return;
    if (!res.ok) {
      setLogStatus("error", `Could not load this run (HTTP ${res.status}).`);
      logPending = false;
      return;
    }
    const r = await res.json();
    lines = r.lines || [];
  } catch {
    if (stale()) return;
    setLogStatus("error", "Could not load this run.");
    logPending = false;
    return;
  }
  if (stale()) return;
  const log = $("#log");
  log.innerHTML = "";
  // Reset before replaying: a run with no TodoWrite call of its own should
