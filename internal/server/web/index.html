<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conveyor</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- One stylesheet per section of the design, in cascade order: concatenating
     them in the order these links appear reproduces the single style element
     they were split out of, which is what keeps the override layers at the end
     (the design pass, the @media blocks) doing what they did. -->
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/masthead.css">
<link rel="stylesheet" href="/line.css">
<link rel="stylesheet" href="/sources.css">
<link rel="stylesheet" href="/report.css">
<link rel="stylesheet" href="/faults.css">
<link rel="stylesheet" href="/panel.css">
<link rel="stylesheet" href="/inbox.css">
<link rel="stylesheet" href="/dialogs.css">
<link rel="stylesheet" href="/design.css">
</head>
<body>

<div class="masthead">
  <img class="glyph" src="/icon.svg" width="22" height="22" alt="">
  <span class="mark">Conveyor</span>
  <span class="readout">
    <span><span class="lamp" id="lamp"></span></span>
    <span id="line1">connecting</span>
  </span>
  <span class="grow"></span>
  <span id="mode-badge" hidden title="Set by -mode on the server; observe never advances anything"></span>
  <button class="ctl" id="notify" hidden>Notify me</button>
  <button class="ctl" id="unblock-all" hidden>Unblock all</button>
  <button class="ctl" id="diagnose" hidden>Diagnose</button>
  <button class="ctl" id="refresh">Refresh</button>
  <button class="ctl primary" id="tick">Tick once</button>
</div>

<div class="itemgone" id="itemgone" hidden role="alert">
  <span id="itemgone-text"></span>
  <button class="ctl" id="itemgone-dismiss">Dismiss</button>
</div>
<div class="needs" id="needs"></div>
<div id="agents"></div>
<div id="sources"></div>
<div id="warnings"></div>
<div id="faults"></div>
<div id="doctor"></div>

<!-- The inbox (#40) is a second way to reach the same items, never a second
     source of truth: it reads the one #rail/#panel already draws from and
     opens the very same panel. Two tabs, not a phone/desktop split — a wide
     screen can use it too, and a narrow one can still fall back to Pipeline. -->
<div class="viewtabs" id="viewtabs" role="tablist" aria-label="Board view">
  <button class="vtab" id="tab-pipeline" role="tab" aria-selected="true" aria-controls="rail-wrap">Pipeline</button>
  <button class="vtab" id="tab-inbox" role="tab" aria-selected="false" aria-controls="inbox">Inbox</button>
</div>

<div class="rail-wrap" id="rail-wrap">
  <div class="line" id="line"><div class="rail" id="rail" tabindex="-1"></div></div>
  <div class="railctl" id="railctl" hidden>
    <button class="railbtn" id="rail-left" aria-label="Scroll the line left">‹</button>
    <div class="railtrack" id="rail-track" role="scrollbar" aria-orientation="horizontal"
        aria-controls="line" tabindex="0" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="railthumb" id="rail-thumb"></div>
    </div>
    <button class="railbtn" id="rail-right" aria-label="Scroll the line right">›</button>
  </div>
</div>

<section class="inbox" id="inbox" aria-label="Inbox" hidden>
  <div class="inbox-controls">
    <input type="search" id="inbox-search" placeholder="Search title or id" aria-label="Search items in the inbox">
    <select id="inbox-source" aria-label="Filter the inbox by source"><option value="">All sources</option></select>
  </div>
  <div class="inbox-subtabs" role="tablist" aria-label="Inbox section">
    <button class="vtab" id="inbox-tab-attention" role="tab" aria-selected="true" aria-controls="inbox-list">Needs attention</button>
    <button class="vtab" id="inbox-tab-done" role="tab" aria-selected="false" aria-controls="inbox-list">Done</button>
  </div>
  <div class="inbox-list" id="inbox-list"></div>
</section>

<dialog id="ask"></dialog>
<dialog id="reportdlg"></dialog>
<div id="printout" class="report"></div>
<div class="scrim" id="scrim"></div>
<aside id="panel" aria-hidden="true">
  <div class="ahead">
    <div style="flex:1">
      <h2 id="ptitle" tabindex="-1">—</h2>
      <div class="sub" id="psub"></div>
    </div>
    <button class="ctl" id="close">Close</button>
  </div>
  <div class="pactions" id="pactions"></div>
  <div class="upper" id="upper">
    <div id="stop"></div>
    <div class="report" id="report"></div>
    <div class="history" id="history"></div>
  </div>
  <div class="todos" id="todos" hidden></div>
  <div class="log" id="log"></div>
</aside>
<!-- Run-level status only: appended log lines never touch this, or a running
     agent would announce every line it wrote (see setLogStatus/setHistoryStatus
     and announce() in the script). Visually hidden, not display:none — an
     off-screen live region is still read by assistive tech; a hidden one is not. -->
<div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<!-- The page's logic, as ES modules: main.js is the entry and imports the
     rest (dom, pure, shared, board, rail, panel, report, drag, device, inbox).
     Module scripts are deferred, which is what this block relied on by
     sitting at the end of <body>. -->
<script type="module" src="/main.js"></script>
</body>
</html>
