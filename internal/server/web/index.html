  // not keep showing whichever run was open before it. renderLine repopulates
  // this as it walks the lines (and any buffered lines appendBuffered adds
  // after), so it ends on that run's own latest state.
  $("#todos").innerHTML = ""; $("#todos").hidden = true;
  for (const line of lines) log.appendChild(renderLine(line));
  logPending = false;
  appendBuffered(lines);
  if (!log.childElementCount) setLogStatus("empty", "No output.");
  else log.scrollTop = log.scrollHeight;
}

// Join the snapshot with whatever arrived over SSE while it was in flight.
// `LogLine` carries no sequence number, so a buffered line can only be told
// apart from one the snapshot already contains by comparing it, position by
// position, against the snapshot's tail — dropping the longest run of
// buffered lines that matches there and keeping the rest. A global
// de-duplication would be wrong: agent output legitimately repeats identical
// lines.
function appendBuffered(snapshotLines) {
  const log = $("#log");
  const buf = logBuffer;
  logBuffer = [];
  const same = (a, b) => a && b && a.stream === b.stream && a.text === b.text && a.timestamp === b.timestamp;
  let overlap = 0;
  for (let m = Math.min(buf.length, snapshotLines.length); m > 0; m--) {
    let match = true;
    for (let i = 0; i < m; i++) {
      if (!same(buf[i], snapshotLines[snapshotLines.length - m + i])) { match = false; break; }
    }
    if (match) { overlap = m; break; }
  }
  for (let i = overlap; i < buf.length; i++) log.appendChild(renderLine(buf[i]));
}

// An agent writes markdown and calls tools; showing that as one monospace blob
// throws away everything it told you about shape. Presentation only — the
// engine still reads no data out of a log, it comes back in $CONVEYOR_RESULT.
function renderLine(line) {
  const el = document.createElement("div");
  const text = line.text ?? "";
  el.className = "ln " + (line.stream === "stderr" ? "stderr"
                        : line.stream === "engine" ? "engine" : "");

  if (!text.trim()) { el.classList.add("blank"); return el; }

  // "  · Bash: git status" — the shape agents/claude/_stream emits.
  const tool = text.match(/^\s*·\s*([A-Za-z_]+):\s?([\s\S]*)$/);
  if (tool) {
    el.classList.add("tool");
    if (tool[1] === "TodoWrite") {
      const list = parseTodos(tool[2]);
      if (list) {
        updateTodos(list);
        const done = list.filter(t => t.status === "completed").length;
        const active = list.find(t => t.status === "in_progress");
        const gist = `${done}/${list.length} done` + (active ? ` · ${active.activeForm || active.content}` : "");
        el.innerHTML = `<span class="tname">TodoWrite</span> <span class="targ">${esc(gist)}</span>`;
        return el;
      }
      // Falls through to the generic rendering below on a shape this does
      // not recognise — the sticky panel just misses this update.
    }
    el.innerHTML = `<span class="tname">${esc(tool[1])}</span> <span class="targ">${esc(tool[2])}</span>`;
    return el;
  }
  if (/^\s*(-{3,}|={3,})\s*$/.test(text)) { el.className = "ln rule"; return el; }
  if (/^#{1,6}\s/.test(text)) {
    el.classList.add("head");
    el.innerHTML = inline(text.replace(/^#{1,6}\s/, ""));
    return el;
  }
  const bullet = text.match(/^(\s*)([-*·])\s+([\s\S]*)$/);
  if (bullet) {
    el.innerHTML = `${bullet[1]}<span class="bullet">${esc(bullet[2])}</span> ${inline(bullet[3])}`;
    return el;
  }
  el.innerHTML = inline(text);
  return el;
}

// The little markdown that actually appears in agent output. Escaped first, so
// nothing a repository contains can inject markup into the board.
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, (_, b) => `<strong>${b}</strong>`);
}

// TodoWrite's arg is the plan itself, sent whole (see agents/claude/_stream),
// not a path or a command truncated to a preview — so it is the one tool line
// here worth parsing back into structure rather than just displaying. Defensive
// by construction: any shape this does not recognise returns null and the
// caller falls back to the plain tool-line rendering every other tool gets.
function parseTodos(raw) {
  let list;
  try { list = JSON.parse(raw); } catch { return null; }
  if (!Array.isArray(list)) return null;
  if (!list.every(t => t && typeof t.content === "string" && typeof t.status === "string")) return null;
  return list;
}

// The agent's own plan, kept current in the sticky panel above the log.
// Presentation only, like everything else renderLine does — this reads
// nothing back into $CONVEYOR_RESULT or the engine.
function updateTodos(list) {
  const box = $("#todos");
  if (!list.length) { box.innerHTML = ""; box.hidden = true; return; }
  box.innerHTML = list.map(t => {
    const mark = t.status === "completed" ? "✔" : t.status === "in_progress" ? "▶" : "○";
    const label = t.status === "in_progress" ? (t.activeForm || t.content) : t.content;
    return `<div class="todo ${esc(t.status)}"><span class="mark">${mark}</span><span>${esc(label)}</span></div>`;
  }).join("");
  box.hidden = false;
}

function closePanel() {
  $("#panel").classList.remove("open"); $("#panel").setAttribute("aria-hidden", "true");
  $("#scrim").classList.remove("open");
  openItemId = null; followRun = null;
  logPending = false; logBuffer = [];
}
$("#close").onclick = closePanel;
$("#scrim").onclick = closePanel;
addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

$("#rail-left").onclick = () => scrollRail(-1);
$("#rail-right").onclick = () => scrollRail(1);
$("#line").addEventListener("scroll", updateRailCtl);
addEventListener("resize", updateRailCtl);

// --- dragging --------------------------------------------------------------
// Two gestures, and they are different things. Within a column a drag reorders,
// and a card's position is what the scheduler reads. Out of the backlog and
// into the next column it *starts* the work: backlog is the absence of a state,
// and deciding something leaves it is the whole of v1's control lever.
//
// Nowhere else. A card dropped straight onto a deploy stage would be a deploy
// nobody reviewed; the pipeline is human-authored ahead of time, not steered
// card by card.
const queueOf = el => el.closest(".queue[data-stage]")?.dataset.stage;
const stageBy = name => (state?.stages || []).find(st => st.name === name);
const startable = (from, into) => {
  const first = (state?.stages || [])[0];
  if (!first || from !== first.name) return false;
  return !!into && stageBy(from)?.next === into;
};

// A refusal belongs on the card that was dropped, not in a console: an operator
// who sees nothing happen concludes the board is broken.
const refusals = new Map();
function refuse(id, why) {
  refusals.set(id, why);
  draw();
  setTimeout(() => { if (refusals.delete(id)) draw(); }, 8000);
}

async function startItem(id, stage) {
  refusals.delete(id);
  const res = await fetch(`/api/items/${encodeURIComponent(id)}/start`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ stage }),
  });
  if (!res.ok) refuse(id, (await res.text()).trim() || `could not start ${id}`);
}

function wireQueue(q) {
  const into = q.dataset.stage;
  q.ondragover = e => {
    if (!dragging || !startable(queueOf(dragging), into)) return;
    e.preventDefault();
    clearMarks();
    q.classList.add("over-stage");
  };
  q.ondragleave = () => q.classList.remove("over-stage");
  q.ondrop = e => {
    if (!dragging || !startable(queueOf(dragging), into)) return;
    e.preventDefault();
    clearMarks();
    startItem(dragging.dataset.id, into);
  };
}

function wireDrag(el) {
  el.ondragstart = e => {
    dragging = el;
    el.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", el.dataset.id);
  };
  el.ondragend = () => {
    el.classList.remove("dragging");
    clearMarks();
    dragging = null;
    justDragged = true;
    setTimeout(() => justDragged = false, 0);
  };
  // A card in another column is not a drop target of its own: the column is.
  // Letting the event through to it is what makes dropping onto a full backlog's
  // neighbour work the same as dropping onto an empty one.
  const reorders = () => dragging && dragging !== el && queueOf(el) === queueOf(dragging);
  el.ondragover = e => {
    if (!reorders()) return;
    e.preventDefault();
    e.stopPropagation();
    clearMarks();
    el.classList.add(below(e, el) ? "over-after" : "over-before");
  };
  el.ondrop = e => {
    if (!reorders()) return;
    e.preventDefault();
    e.stopPropagation();
    el.parentNode.insertBefore(dragging, below(e, el) ? el.nextSibling : el);
    clearMarks();
    saveOrder();
  };
}

const below = (e, el) => {
  const r = el.getBoundingClientRect();
  return e.clientY > r.top + r.height / 2;
};
const clearMarks = () =>
  document.querySelectorAll(".over-before,.over-after,.over-stage")
    .forEach(n => n.classList.remove("over-before", "over-after", "over-stage"));

// Read the board back as one list. Stage order dominates and the drag decides
// within a stage — an item further along the line should not be overtaken by
// one that has not started, so the queues are read from the end of the line
// back towards the start. Reading them left to right says the opposite: it
// ranks the whole backlog above work already under way.
async function saveOrder() {
  const flow = (state?.stages || []).filter(st => !st.terminal).reverse();
  const ids = flow.flatMap(st =>
    [...document.querySelectorAll(`.queue[data-stage="${CSS.escape(st.name)}"] .item`)]
      .map(el => el.dataset.id));
  // Never save an empty order while the board holds cards. A selector that
  // stops matching would otherwise wipe a hand-made arrangement silently —
  // which is exactly what a missing data-stage attribute once did.
  if (!ids.length && document.querySelectorAll(".queue[data-stage] .item").length) {
    console.warn("refusing to save an empty order");
    return;
  }
  await fetch("/api/order", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(ids),
  });
}

// Clearing a mark is a provider write, so the control says so while it lands:
// a card that keeps its red for another second reads as a button that did
// nothing, and the second press is the one that races.
async function handBack(id, btn) {
  const box = document.querySelector("#stop .answer");
  const answer = box ? box.value.trim() : "";
  if (btn) { btn.disabled = true; btn.textContent = answer ? "answering" : "handing back"; }
  const res = await fetch(`/api/items/${encodeURIComponent(id)}/unblock`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ answer }),
  });
  if (!res.ok) { refuse(id, (await res.text()).trim() || `could not unblock ${id}`); return; }
  // The panel was showing a stop that no longer exists.
  $("#stop").innerHTML = "";
}

$("#unblock-all").onclick = async e => {
  // Questions are not cleared in bulk and the button must not imply they are:
  // a count that includes them promises something the server will not do.
  const marked = (state?.items || []).filter(it => it.blocked);
  const asking = marked.filter(it => (blocks[it.id] || {}).asked).length;
  const n = marked.length - asking;
  if (!n) {
    alert(asking
      ? `Nothing to retry. ${asking} item${asking === 1 ? " is" : "s are"} waiting on an answer from you — open the card and reply.`
      : "Nothing is marked.");
    return;
  }
  if (!confirm(`Clear the mark on ${n} item${n === 1 ? "" : "s"}? Each goes straight back into the line.`
    + (asking ? `\n\n${asking} waiting on an answer from you ${asking === 1 ? "is" : "are"} left alone.` : ""))) return;
  e.target.disabled = true;
  e.target.textContent = "handing back…";
  await fetch("/api/unblock", { method:"POST" });
  setTimeout(() => e.target.disabled = false, 2000);
};

$("#diagnose").onclick = () => {
  // Dry run is the only thing a click starts — apply is a second, explicit
  // press on the Apply button the result itself offers, never implied by this
  // one. The blast radius is comments and clears across every marked item at
  // once, and that is not a decision to make with one gesture.
  const marked = (state?.items || []).filter(it => it.blocked).length;
  if (!marked) { alert("Nothing is marked."); return; }
  startDoctor(false);
};

$("#refresh").onclick = () => fetch("/api/refresh", { method:"POST" });

// ---- the app on a device -------------------------------------------------
// Installing is the browser's gesture; this only registers the worker that
// makes the page installable and receives a push. A subscription is taken on
// the first press of the button, again silently whenever permission is
// already granted (an install, a reinstall, a cleared server), and posted on
// every load so the server always holds the current one.
const notifyBtn = $("#notify");
const b64ToU8 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));

async function pushState() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return null;
  const reg = await navigator.serviceWorker.ready;
  return { reg, sub: await reg.pushManager.getSubscription() };
}
async function subscribePush() {
  const st = await pushState();
  if (!st) return;
  notifyBtn.disabled = true;
  try {
    if ((await Notification.requestPermission()) !== "granted") return;
    const { key } = await (await fetch("/api/push/key")).json();
    if (!key) { alert("The server has no push key; notifications are off there."); return; }
    const sub = await st.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
    await fetch("/api/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub) });
  } catch (err) {
    alert(`Could not turn notifications on: ${err.message || err}`);
  } finally {
    notifyBtn.disabled = false;
    drawNotify();
  }
}
async function unsubscribePush() {
  const st = await pushState();
  if (!st || !st.sub) return;
  if (!confirm("Turn notifications off on this device?")) return;
  await fetch("/api/push/unsubscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ endpoint: st.sub.endpoint }) });
  await st.sub.unsubscribe();
  drawNotify();
}
async function drawNotify() {
  const st = await pushState();
  if (!st) { notifyBtn.hidden = true; return; }
  notifyBtn.hidden = false;
  if (Notification.permission === "denied") {
    notifyBtn.textContent = "Notifications blocked";
    notifyBtn.title = "Allow notifications for this site in the browser's settings";
    notifyBtn.onclick = null;
    return;
  }
  notifyBtn.textContent = st.sub ? "Notifications on" : "Notify me";
  notifyBtn.title = st.sub ? "Press to turn them off on this device" : "Get a push when something needs you or ships";
  notifyBtn.onclick = st.sub ? unsubscribePush : subscribePush;
  if (st.sub) fetch("/api/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(st.sub) });
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").then(async () => {
    await drawNotify();
    const st = await pushState();
    if (!st || st.sub) return;
    const installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    // Already allowed, or running as the installed app: subscribe without a press.
    if (Notification.permission === "granted" || (installed && Notification.permission === "default")) subscribePush();
  }).catch(() => {});
  addEventListener("appinstalled", () => subscribePush());
}

// A notification opens the item it was about.
function openFromHash() {
  const m = location.hash.match(/^#item=(.+)$/);
  if (!m || !state) return;
  const id = decodeURIComponent(m[1]);
  const it = (state.items || []).find(i => i.id === id);
  history.replaceState(null, "", location.pathname);
  if (it) inspect(it.id, it.title, it.stage);
}
addEventListener("hashchange", openFromHash);
$("#tick").onclick = async e => {
  e.target.disabled = true;
  const res = await fetch("/api/tick", { method:"POST" });
  if (res.status === 409) $("#line1").textContent = "a tick is already in flight";
  setTimeout(() => e.target.disabled = false, 1500);
};

const es = new EventSource("/api/events");
es.onmessage = ev => {
  const e = JSON.parse(ev.data);
  if (e.kind === "log") {
    if (e.runId !== followRun || !e.line) return;
    // The snapshot for this run has not rendered yet — buffer rather than
    // append, or a line can land above lines the snapshot has not shown yet.
    if (logPending) { logBuffer.push(e.line); return; }
    const log = $("#log");
    const pinned = log.scrollHeight - log.scrollTop - log.clientHeight < 48;
    log.appendChild(renderLine(e.line));
    if (pinned) log.scrollTop = log.scrollHeight;
    return;
  }
  if (e.kind === "transition" && openItemId && e.transition?.item?.id === openItemId) loadHistory(openItemId);
  load();
  loadDoctor();
};
es.onerror = () => fault("disconnected");

load();
loadDoctor();
</script>
