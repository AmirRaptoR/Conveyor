<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conveyor</title>
<style>
  /* An instrument panel for a production line. Graphite and steel throughout;
     the only saturated colour in the interface is a signal, so state is the one
     thing that can draw the eye. */
  :root {
    --ground:#14181d;      /* painted machinery, not black */
    --panel:#1a1f26;
    --raised:#20262f;
    --rule:#2b323c;
    --rule-soft:#232932;
    --ink:#dfe4ec;
    --dim:#7d8798;
    --faint:#535d6d;

    --run:#e0a13a;         /* amber: working */
    --ok:#4caf72;          /* green: done */
    --stop:#e05a4f;        /* red: needs a human */

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --station: 236px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground:#eceef1; --panel:#f7f8fa; --raised:#fff;
      --rule:#ccd2da; --rule-soft:#dee2e8;
      --ink:#171c23; --dim:#5b6474; --faint:#8b94a3;
    }
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font:400 13px/1.5 var(--mono);
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible { outline:2px solid var(--run); outline-offset:2px; }

  /* ---- masthead ---------------------------------------------------------- */
  .masthead {
    display:flex; align-items:baseline; gap:18px;
    padding:16px 22px 14px; border-bottom:1px solid var(--rule);
    background:var(--panel);
  }
  .mark { font-size:13px; letter-spacing:.34em; text-transform:uppercase; font-weight:500; }
  .readout { display:flex; gap:16px; color:var(--dim); font-size:11px; letter-spacing:.06em; }
  .readout b { color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; }
  .grow { flex:1; }

  .lamp { width:6px; height:6px; border-radius:50%; background:var(--faint); display:inline-block; }
  .lamp.idle { background:var(--ok); }
  .lamp.busy { background:var(--run); animation:pulse 1.1s ease-in-out infinite; }
  .lamp.down { background:var(--stop); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

  .ctl {
    font:inherit; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--dim); background:transparent; border:1px solid var(--rule);
    padding:6px 13px; cursor:pointer;
  }
  .ctl:hover:not(:disabled) { color:var(--ink); border-color:var(--faint); }
  .ctl:disabled { opacity:.35; cursor:default; }
  .ctl.primary { color:var(--ink); border-color:var(--faint); }

  /* ---- the line ---------------------------------------------------------- */
  .line { padding:30px 22px 40px; overflow-x:auto; }
  .rail { display:flex; align-items:flex-start; min-width:min-content; position:relative; }

  .station { flex:0 0 var(--station); position:relative; z-index:1; padding-right:14px; }
  .station:last-child { padding-right:0; }

  .plate {
    background:var(--panel); border:1px solid var(--rule); padding:9px 11px 10px;
    height:52px; /* fixed, so the belt meets every station at the same height */
  }
  .station.live .plate { border-color:var(--run); }
  .name {
    font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
  .count { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  .runs-label { margin-top:5px; font-size:10.5px; color:var(--faint); letter-spacing:.05em; }
  .runs-label b { color:var(--run); font-weight:400; }

  /* The belt: each station's queue carries the line as its top edge, stretched
     into the gutter so the segments meet and read as one continuous run. */
  .queue {
    margin:14px -14px 0 0; padding:14px 14px 0 0;
    border-top:1px solid var(--rule);
    display:flex; flex-direction:column; gap:6px;
  }
  .station.live .queue { border-top-color:var(--run); }
  /* Direction, marked once per station rather than decorating every gap. */
  .station { position:relative; }
  .station::after {
    content:""; position:absolute; right:-3px; top:calc(14px + var(--plate-h, 52px));
    width:5px; height:5px; margin-top:-2px;
    border-top:1px solid var(--rule); border-right:1px solid var(--rule);
    transform:rotate(45deg);
  }
  .station:last-of-type::after { display:none; }
  .slot { border:1px dashed var(--rule-soft); padding:9px 10px; color:var(--faint); font-size:11px; }

  .item {
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--raised); border:1px solid var(--rule); border-left:2px solid var(--faint);
    padding:9px 11px; color:inherit; font:inherit;
  }
  .item:hover { border-color:var(--faint); }
  .item .title { font-size:12px; line-height:1.45; }
  .item .foot {
    margin-top:7px; display:flex; gap:9px; align-items:center;
    color:var(--faint); font-size:10.5px; letter-spacing:.04em;
  }
  .item .prio { font-variant-numeric:tabular-nums; }
  .item.p0 { border-left-color:var(--stop); } .item.p0 .prio { color:var(--stop); }
  .item.p1 { border-left-color:var(--run); }  .item.p1 .prio { color:var(--run); }
  .item.working { border-left-color:var(--run); }

  /* Terminal stations leave the line: done at its end, blocked diverted off it. */
  .terminus { flex:0 0 auto; padding-left:30px; position:relative; z-index:1; }
  .terminus .plate { min-width:158px; }
  .terminus .queue { margin-right:0; padding-right:0; border-top-color:var(--rule-soft); }
  /* done sits at the end of the line; blocked is diverted off it. */
  .terminus.done::before {
    content:""; position:absolute; left:0; top:calc(14px + 52px); width:30px; height:1px;
    background:var(--rule);
  }
  .terminus.divert { margin-top:78px; }
  .terminus.divert::before {
    content:""; position:absolute; left:0; top:-26px; width:1px; height:26px;
    background:color-mix(in srgb, var(--stop) 55%, var(--rule));
  }
  .terminus.divert::after {
    content:""; position:absolute; left:0; top:calc(14px + 52px); width:30px; height:1px;
    background:color-mix(in srgb, var(--stop) 55%, var(--rule));
  }
  .terminus.done .plate { border-color:color-mix(in srgb, var(--ok) 45%, var(--rule)); }
  .terminus.done .name { color:var(--ok); }
  .terminus.divert .plate { border-color:color-mix(in srgb, var(--stop) 55%, var(--rule)); }
  .terminus.divert .name { color:var(--stop); }

  /* ---- faults ------------------------------------------------------------ */
  .faults { margin:0 22px; border-left:2px solid var(--stop); background:var(--panel); padding:12px 16px; }
  .faults h2 { margin:0 0 3px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--stop); font-weight:500; }
  .faults div { color:var(--dim); font-size:11.5px; line-height:1.7; }
  .faults b { color:var(--ink); font-weight:500; }

  /* ---- inspection panel -------------------------------------------------- */
  .scrim {
    position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none;
    transition:opacity .16s ease; z-index:9;
  }
  .scrim.open { opacity:1; pointer-events:auto; }
  aside {
    position:fixed; top:0; right:0; width:min(700px, 96vw); height:100%;
    background:var(--panel); border-left:1px solid var(--rule);
    display:flex; flex-direction:column; transform:translateX(100%);
    transition:transform .18s cubic-bezier(.4,0,.2,1); z-index:10;
  }
  aside.open { transform:none; }
  .ahead { display:flex; align-items:flex-start; gap:14px; padding:16px 18px; border-bottom:1px solid var(--rule); }
  .ahead h2 { margin:0; font-size:13px; font-weight:500; line-height:1.5; }
  .ahead .sub { margin-top:5px; color:var(--faint); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; }

  /* A run history is genuinely a sequence, so it is drawn as one. */
  .history { flex:0 0 auto; max-height:30vh; overflow-y:auto; padding:12px 18px; border-bottom:1px solid var(--rule); }
  .tr {
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:transparent; border:0; border-left:1px solid var(--rule);
    color:var(--dim); font:inherit; font-size:11px; padding:6px 0 6px 15px;
    cursor:pointer; position:relative;
  }
  .tr::before {
    content:""; position:absolute; left:-3.5px; top:50%; margin-top:-2.5px;
    width:5px; height:5px; border-radius:50%; background:var(--faint);
  }
  .tr:hover { color:var(--ink); }
  .tr.sel { color:var(--ink); border-left-color:var(--faint); }
  .tr.sel::before { background:var(--ink); }
  .tr .kind { flex:0 0 54px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; font-size:10px; }
  .tr .path { flex:1; }
  .tr .arrow { color:var(--faint); }
  .tr .verdict { letter-spacing:.06em; font-size:10.5px; }
  .tr.success .verdict { color:var(--ok); }      .tr.success::before { background:var(--ok); }
  .tr.failure .verdict, .tr.timeout .verdict { color:var(--stop); }
  .tr.failure::before, .tr.timeout::before { background:var(--stop); }
  .tr.blocked .verdict { color:var(--run); }      .tr.blocked::before { background:var(--run); }
  .tr.running .verdict { color:var(--run); }      .tr.running::before { background:var(--run); animation:pulse 1.1s ease-in-out infinite; }

  .log {
    margin:0; flex:1 1 auto; min-height:0; overflow:auto; padding:14px 18px;
    font-size:11.5px; line-height:1.75; white-space:pre-wrap; word-break:break-word;
    color:var(--dim);
  }
  .log:empty::after { content:"No output."; color:var(--faint); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation:none !important; transition:none !important; }
  }
  @media (max-width: 640px) {
    :root { --station: 200px; }
    .masthead { flex-wrap:wrap; gap:10px; }
  }
</style>
</head>
<body>

<div class="masthead">
  <span class="mark">Conveyor</span>
  <span class="readout">
    <span><span class="lamp" id="lamp"></span></span>
    <span id="line1">connecting</span>
  </span>
  <span class="grow"></span>
  <button class="ctl" id="refresh">Refresh</button>
  <button class="ctl primary" id="tick">Tick once</button>
</div>

<div id="faults"></div>
<div class="line"><div class="rail" id="rail"></div></div>

<div class="scrim" id="scrim"></div>
<aside id="panel" aria-hidden="true">
  <div class="ahead">
    <div style="flex:1">
      <h2 id="ptitle">—</h2>
      <div class="sub" id="psub"></div>
    </div>
    <button class="ctl" id="close">Close</button>
  </div>
  <div class="history" id="history"></div>
  <pre class="log" id="log"></pre>
</aside>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let state = null, openItemId = null, followRun = null;

async function load() {
  try {
    state = await (await fetch("/api/state")).json();
    draw();
  } catch { fault("disconnected"); }
}

function fault(msg) { $("#lamp").className = "lamp down"; $("#line1").textContent = msg; }

function draw() {
  if (!state) return;
  const stages = state.stages || [], items = state.items || [];
  const active = state.active;

  const bucket = {};
  for (const st of stages) bucket[st.name] = [];
  for (const it of items) (bucket[it.stage] ||= []).push(it);

  // The line runs through the working stages; terminal ones leave it.
  const flow = stages.filter(s => !s.terminal);
  const ends = stages.filter(s => s.terminal);

  $("#rail").innerHTML =
    flow.map(st => station(st, bucket[st.name] || [], active)).join("") +
    ends.map(st => terminus(st, bucket[st.name] || [])).join("");

  const bad = (state.sources || []).filter(s => (s.problems || []).length);
  $("#faults").innerHTML = bad.length ? `<div class="faults">
      <h2>${bad.length} source${bad.length > 1 ? "s" : ""} cannot run</h2>
      ${bad.map(s => `<div><b>${esc(s.name)}</b> — ${s.problems.map(esc).join("<br>")}</div>`).join("")}
    </div>` : "";

  $("#lamp").className = "lamp " + (active ? "busy" : state.polling ? "busy" : "idle");
  const when = state.updatedAt ? new Date(state.updatedAt).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"}) : "—";
  $("#line1").innerHTML = active
    ? `<b>${esc(active.stage)}</b> running &middot; ${esc(active.itemId)}`
    : `<b>${items.length}</b> items &middot; ${(state.sources||[]).length} sources &middot; ${when}`;

  document.querySelectorAll(".item").forEach(el =>
    el.onclick = () => inspect(el.dataset.id, el.dataset.title, el.dataset.stage));
}

function station(st, items, active) {
  const live = active && active.stage === st.name;
  return `<section class="station${live ? " live" : ""}">
    <div class="plate">
      <div class="name">${esc(st.name)}<span class="count">${items.length}</span></div>
      <div class="runs-label">${st.script ? `runs <b>${esc(st.script)}</b>` : st.runs ? "runs inline" : "queue"}</div>
    </div>
    <div class="queue">${items.length ? items.map(it => card(it, active)).join("")
      : `<div class="slot">empty</div>`}</div>
  </section>`;
}

function terminus(st, items) {
  const kind = st.name === "blocked" ? "divert" : "done";
  return `<section class="terminus ${kind}">
    <div class="plate">
      <div class="name">${esc(st.name)}<span class="count">${items.length}</span></div>
      <div class="runs-label">${kind === "divert" ? "needs a human" : "end of line"}</div>
    </div>
    <div class="queue">${items.map(it => card(it, null)).join("")}</div>
  </section>`;
}

function card(it, active) {
  const ranked = it.priority !== null && it.priority !== undefined;
  const working = active && active.itemId === it.id;
  return `<button class="item${ranked ? " p" + it.priority : ""}${working ? " working" : ""}"
      data-id="${esc(it.id)}" data-title="${esc(it.title)}" data-stage="${esc(it.stage)}">
    <span class="title">${esc(it.title)}</span>
    <span class="foot">
      <span class="prio">${ranked ? "p" + it.priority : "—"}</span>
      <span>${esc(it.id)}</span>
    </span>
  </button>`;
}

async function inspect(id, title, stage) {
  openItemId = id;
  $("#ptitle").textContent = title || id;
  $("#psub").textContent = `${id} · ${stage}`;
  $("#panel").classList.add("open"); $("#panel").setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("open");
  $("#log").textContent = "";
  await loadHistory(id);
}

async function loadHistory(id) {
  const runs = await (await fetch(`/api/runs?item=${encodeURIComponent(id)}`)).json();
  $("#history").innerHTML = runs.length ? runs.map(r => `
    <button class="tr ${esc(r.outcome)}" data-run="${esc(r.id)}">
      <span class="kind">${esc(r.kind)}</span>
      <span class="path">${esc(r.from || "")} <span class="arrow">&rarr;</span> ${esc(r.to || "")}</span>
      <span class="verdict">${esc(r.outcome)}</span>
    </button>`).join("")
    : `<div class="slot">No runs yet.</div>`;
  document.querySelectorAll("[data-run]").forEach(b => b.onclick = () => showRun(b.dataset.run));
  if (runs.length) showRun(runs[0].id);
}

async function showRun(id) {
  followRun = id;
  document.querySelectorAll("[data-run]").forEach(b => b.classList.toggle("sel", b.dataset.run === id));
  const r = await (await fetch(`/api/runs/${id}`)).json();
  $("#log").textContent = r.log || "";
  $("#log").scrollTop = $("#log").scrollHeight;
}

function closePanel() {
  $("#panel").classList.remove("open"); $("#panel").setAttribute("aria-hidden", "true");
  $("#scrim").classList.remove("open");
  openItemId = null; followRun = null;
}
$("#close").onclick = closePanel;
$("#scrim").onclick = closePanel;
addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

$("#refresh").onclick = () => fetch("/api/refresh", { method:"POST" });
$("#tick").onclick = async e => {
  e.target.disabled = true;
  const res = await fetch("/api/tick", { method:"POST" });
  if (res.status === 409) $("#line1").textContent = "a tick is already in flight";
  setTimeout(() => e.target.disabled = false, 1500);
};

const es = new EventSource("/api/events");
es.onmessage = ev => {
  const e = JSON.parse(ev.data);
  if (e.kind === "log") {
    if (e.runId === followRun && e.line) {
      const pre = $("#log");
      const pinned = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 48;
      pre.textContent += e.line.text + "\n";
      if (pinned) pre.scrollTop = pre.scrollHeight;
    }
    return;
  }
  if (e.kind === "transition" && openItemId && e.transition?.item?.id === openItemId) loadHistory(openItemId);
  load();
};
es.onerror = () => fault("disconnected");

load();
</script>
</body>
</html>
