# conveyor — example configuration
#
# The engine knows nothing about GitHub, git or AI. Everything provider-specific
# lives in the scripts referenced below. See docs/CONTRACTS.md.

version: 1

# Where the provider adapters live. Defaults to providers/ beside this file,
# which is right for the checkout and wrong for a working config kept outside
# it — point it at the checkout then:
#
#   providers: ~/codes/Conveyor/providers

# Who may open the board. Omit it entirely and the board is open — which is
# fine, and refused on anything but a loopback address, because the board is a
# control plane: it starts agent runs, reorders work and hands items back.
#
# There is no plaintext form on purpose. A password written here is a password
# in every backup of this file and in every `cat` of it, so the only thing that
# goes in is a hash:
#
#   conveyor passwd amir      # prints the block below, ready to paste
#
# This replaced a reverse proxy doing basic auth in front of the process — a
# second server, a second config and a second password store for one line of
# behaviour.
#
# auth:
#   realm: conveyor
#   users:
#     amir: "pbkdf2-sha256$600000$<salt>$<key>"
#   # origins: extra origins (scheme + host + optional port, exactly as a
#   # browser's Origin header writes it) allowed to drive the board beyond
#   # loopback and the listen address itself. Empty is the default: same-origin
#   # only. Needed behind a proxy that rewrites Host — Caddy's default
#   # forwarding does not, so the common deployment in this repo needs nothing
#   # here.
#   origins:
#     - "https://board.example.com"
#
# Regardless of auth: above, serve also always listens on a Unix socket at
# <data>/api.sock, mode 0600 and no password — the OS user this process runs
# as already has full authority over the data directory, and loopback TCP
# stays behind auth.users no matter the peer, because a same-host proxy
# (Caddy, a tunnel) looks exactly as local as that user does.

concurrency:
  perSource: 1        # items in flight per this source. Safe above 1 too: an
                      # item works in its own git worktree, not the source's
                      # checkout, so two agents on one repository never share
                      # a directory. See §5.
  perStage: 1         # one item per stage, so the pipeline behaves like a line:
                      # a station works a single item while others run their own
  global: 4           # total transitions in flight, whatever they cost.

# What the work actually consumes, by name, and how much of it there is.
#
# A transition is not the scarce thing. One account's quota, one deploy host,
# one staging database is — and `global:` counts every transition equally, so
# the number had to be picked for the agent runs and a stage that only reads
# the GitHub API queued behind them for no reason at all. Name the scarce
# thing here, list it on the stages that spend it, and everything else is
# bounded by nothing but `global`.
#
# Names are yours. The engine never reads one; it counts them.
resources:
  claude: 1           # one Claude run at a time, across every repository
  codex: 2
  ssh-prod: 5         # five concurrent deploys to the production host

poll: 5m              # how often to re-list every source
retryStalled: 1h      # when EVERY item is marked and nothing can move at all,
                      # clear the marks this often and let the line try again. A
                      # total stall is almost always the outside world — every
                      # agent over its usage limit, a credential that expired
                      # overnight — and that comes back on its own hours after
                      # the board gave up. The guard is "everything" on purpose:
                      # while one item can still move, a mark is a decision
                      # waiting on a person, and clearing it just spends an agent
                      # run to be told the same thing. Unset means never.
timeout: 90m          # default per-script timeout; stages may override
discovery: 2m         # how long one source's list script may run before that
                      # poll treats it as failed and falls back to its
                      # last-good items, flagged stale. Independent of and
                      # much shorter than timeout: a listing is a handful of
                      # API calls, not agent work, and a hung source must not
                      # be able to delay any other source's listing.

logs:
  # Read and validated now, but not yet enforced: no sweep runs against these
  # keys today, so run directories accumulate under data/runs/ regardless of
  # what is set here. The values are reserved for the sweep that will read
  # them, whenever it lands, so the schema does not change out from under a
  # working config.
  retention: 30d      # once implemented: runs older than this are swept
  sweepAt: "04:00"    # once implemented: daily, and once on startup
                      # A run will be PINNED and never swept while it is the
                      # most recent failed/blocked run of an item still in
                      # that state: retention must not delete the evidence
                      # for the thing currently asking for attention.

# ---------------------------------------------------------------------------
# Stages. Minimum two. Order defines the board's columns, left to right, and the
# default "next stage" on success.
#
# This is the state machine and nothing else — which columns exist and where an
# item goes next. It says nothing about how any work is done.
#
# `script:` names what runs on entering a stage. It is a name, not a path and
# not a command: every source must provide that name in conveyor.d/<source>/,
# and a source missing one is reported and skipped. A stage with no `script:`
# runs nothing and is simply a queue.
#
# `onSuccess:` is the only route. There is no onFailure and no onBlocked: any
# non-zero exit leaves the item in the stage it stopped in, wearing a blocked
# mark that the provider writes in its own vocabulary, and the scheduler never
# picks a marked item. Clearing the mark is one label, and the work resumes
# where it stopped rather than restarting from the top.
#
# How the work is actually done — which agent, which model, which tools — lives
# in each source's script, because it differs per repository and the engine must
# never know. Onboarding a repository is writing its scripts.
# ---------------------------------------------------------------------------
stages:
  - name: backlog
    # No script: nothing runs. Items land here and wait.

  - name: refining
    script: refine            # conveyor.d/<source>/refine — the stage and the
                              # script need not share a name
    timeout: 30m
    onSuccess: ready          # explicit; would default to the next stage anyway
                              # There is no onFailure. A refine that fails stops
                              # where it is, wearing a blocked mark, and resumes
                              # there when a human clears it.

  - name: ready
    # --- reserved for v2, inert in v1 ---
    # v1 is a pipeline: items advance automatically and there is no dragging.
    # These keys are read and validated now so the schema does not change later.
    manual: false             # v2: engine never auto-advances OUT of this stage
    allowManual: true         # v2: may a human move a card INTO this stage?
                              # Some stages must never be entered by hand.

  - name: in-progress
    script: implement         # conveyor.d/<source>/implement
    onSuccess: announcing
    resources: [claude]       # what this stage's work consumes. A transition
                              # into it takes one `claude` and gives it back
                              # when it ends; it starts only when it can have
                              # every resource it names, so nothing sits on
                              # half of what it needs. Declared here because
                              # this is where the work is described — but the
                              # same stage is Claude in one repository and
                              # Codex in the next, so a source that spends
                              # something different says so in its own
                              # `scripts:` entry, which replaces this list.
    maxAttempts: 2            # two goes before the item is marked blocked where
                              # it stands. Unset means one: the first failure
                              # marks it, because a failure that neither routed
                              # nor marked would be re-run on every poll forever.

  - name: announcing
    # The other form: a body written here instead of a name resolved per source.
    # Use it only where every source does the same thing — it cannot vary, which
    # is what `script:` is for. It needs a shebang: the engine writes this out
    # and execs it, and never picks an interpreter for you.
    #
    # Keep it small. Anything with real logic wants to be a file, where a shell
    # can check it and a person can run it by hand.
    run: |
      #!/usr/bin/env bash
      cat >/dev/null    # the item arrives as JSON on stdin; ignore it here
      echo "$CONVEYOR_SOURCE #$CONVEYOR_ITEM_REF is done"
    onSuccess: cleaning-up

  - name: cleaning-up
    # Buttons a person may press on a card sitting in this stage. Pressing one
    # arms a single word for the next run of this stage for that item, handed
    # to the script in $CONVEYOR_MANUAL and on stdin, and spent by it.
    #
    # This is the whole of the manual override, and it is deliberately not a
    # way to drive the pipeline: an action cannot move an item, choose a stage
    # or skip a script. It hands one word to the script, which decides what —
    # if anything — that word means, so a gate a person can open stays a gate
    # the script still owns. The shipped `approve` reads `merge-now` and takes
    # it to mean "stop waiting out the quiet period", never "merge whatever
    # state this is in": every other check still has to pass.
    #
    # The other half of the same idea is that a script may say what it is
    # waiting for. Exiting 10 with {"waiting": {"until": "…", "why": "…"}} in
    # $CONVEYOR_RESULT (agents/_blocked:waits) draws a live countdown on the
    # card — a resting item and a stuck one look identical otherwise.
    actions:
      - name: clean-now
        label: Clean up now
        confirm: Remove this item's worktree and branches now?
    script: cleanup           # agents/git/cleanup, or a source's own — see below
    onSuccess: done
    # An item in flight owns real resources: a worktree on disk, a branch here
    # and one on the remote, whatever a repository started to test with. A
    # stage is where work goes, and giving those back is work — it can fail, it
    # can be retried, and a person can see on the board when it did not happen.
    # The alternative, cleaning up inside whichever stage happened to finish
    # last, is invisible when it breaks and skipped entirely for an item that
    # reached the end some other way.

  - name: done
    terminal: true            # no further transitions

# ---------------------------------------------------------------------------
# Sources. Only what is listed here is ever scanned — there is no directory
# auto-discovery. Adding a repo is adding an entry.
#
# `provider:` names a folder under providers/. The engine finds list and move
# inside it by name, with or without an extension: list.sh, list.py and a
# compiled `list` are equivalent. Writing a new provider is creating a folder.
#
# A source cannot name its two scripts separately, on purpose — that would let
# one pair GitHub's list with Azure's move, and nothing downstream could tell.
# ---------------------------------------------------------------------------
sources:
  - name: mock
    # A provider needing no configuration stays one line. The block form carries
    # params, which reach ONLY list, move and preflight — labels are GitHub's
    # vocabulary, and a stage script running an agent has no use for them:
    #
    #   provider:
    #     name: github
    #     params:
    #       STAGE_LABELS: |
    #         refining=status:refining
    #       BLOCKED_LABEL: blocked
    #
    # Two vocabularies, two keys, because they are two different facts: which
    # label means which stage, and which label means "stopped, needs a human".
    #
    # There is no key for "never list this", because listing is opt-in: an issue
    # reaches the board only by wearing a stage label, the blocked mark, or the
    # bare onboarding tag (LABEL_PREFIX without its separator — `conveyor`).
    # Handing a repository over one issue at a time is labelling that issue;
    # leaving one to a person is saying nothing about it.
    provider: mock
    workdir: .

    # What this source IS — reaches every script it runs, list and move too.
    env:
      GREETING: "hello from the mock source"

    # What this source PROVIDES, for the names the stages ask for. `agent:`
    # resolves agents/<name>/<script>, the way `provider:` resolves under
    # providers/. Use `script:` instead for a path of your own.
    scripts:
      refine:
        agent: mock
        params:
          # Reach this script only. Two stages can both take a PROMPT without
          # colliding, which is why params sit here and not in env.
          NOTE: "refining"
      implement:
        agent: mock
        params:
          NOTE: "implementing"
        # This source's version of `implement` spends nothing scarce — it is a
        # mock. Naming resources here replaces the stage's list outright rather
        # than adding to it, so a repository running a different agent (or none)
        # is not throttled by the one the stage was written for.
        resources: []
      cleanup:
        # The git half is the same in every repository, so it ships. A source
        # that also starts containers, clones a database or puts up a preview
        # points this at its own script and calls agents/git/cleanup from it if
        # it wants the git half too.
        agent: git
      doctor:
        # A reserved key — no stage names it. POST /api/doctor sweeps every
        # marked item through it. Try it: mark an item, then run the sweep.
        agent: mock

  # A real source, for comparison — swap `agent: claude` for `agent: codex` and
  # only this repository changes:
  #
  # - name: midgame
  #   workdir: ~/codes/midgame
  #   provider:
  #     name: github
  #     params:
  #       STAGE_LABELS: |
  #         refining=status:refining
  #         ready=status:ready
  #         in-progress=status:in-progress
  #       # The mark, in GitHub's vocabulary. Not a stage: an issue wearing it
  #       # keeps whatever status:* it stopped on.
  #       BLOCKED_LABEL: blocked
  #   env:
  #     REPO: RaptoR-Soft/midgame
  #     # A default for every stage of this repository. Script params layer over
  #     # env:, so a stage that wants a different model just says so below.
  #     MODEL: claude-sonnet-5
  #   scripts:
  #     refine:
  #       agent: claude
  #       params:
  #         ALLOWED_TOOLS: "Bash,Read,Glob,Grep"
  #         MAX_TURNS: "40"
  #         # The expensive one, deliberately, and the only stage that gets it.
  #         # Refinement writes the spec every later stage is judged against; a
  #         # bad spec costs a whole implement + review cycle, which is more
  #         # quota than the difference. This is where "cheaper is as good" is
  #         # least likely to hold.
  #         MODEL: claude-opus-5
  #         PROMPT: |
  #           Refine this issue until it is ready to implement.
  #           ...
  #     implement:
  #       agent: claude
  #       params:
  #         # Cheaper, with the large window kept. What this sets is the
  #         # orchestrator of the TDD loop — the skill already fans the actual
  #         # work out to its own sonnet and haiku subagents. The [1m] is the
  #         # deliberate part: implement is the stage that runs long enough to
  #         # want the window, and dropping it trades quota for running out of
  #         # context mid-run, which is not a saving.
  #         MODEL: claude-sonnet-5[1m]
  #         PROMPT: "/implement $REF"
  #     review:
  #       agent: claude
  #       # This stage's timeout, for this source only. Unset means the
  #       # stage's. A repository whose integration suite alone runs for a
  #       # quarter of an hour needs more than one whose whole suite takes
  #       # under a minute, and raising the stage to fit the first would
  #       # remove the guard from the second.
  #       timeout: 75m
  #       params:
  #         # Cheaper still: Codex is the reviewer here, and this side
  #         # adjudicates its findings and merges. Judging a finding is a
  #         # smaller job than producing one.
  #         MODEL: claude-sonnet-5
  #         PROMPT: "/review $REF"
  #     doctor:
  #       # A reserved key — no stage names it. `POST /api/doctor` sweeps every
  #       # item this repository has marked through it, one at a time, on
  #       # demand: reads the mark's kind and reason and this item's own run
  #       # history, and decides whether to retry it, resume it, or leave it
  #       # for a person. A source declaring none simply has its marked items
  #       # skipped by a sweep — this is not required to onboard a repository.
  #       agent: claude
  #       params:
  #         MODEL: claude-sonnet-5
  #
  # Leaving MODEL unset is a choice too, and the one this repository ships:
  # every adapter then inherits whatever the operator's CLI is configured with,
  # which today resolves to claude-opus-5[1m] — the most expensive tier, at the
  # largest window, arrived at by default rather than by decision. The adapters
  # will not pick for you; that opinion belongs here, where it can differ per
  # repository. Whichever way it goes, each run writes the model it actually
  # used into its log, so the choice can be checked against the blocked rate
  # instead of argued about.
