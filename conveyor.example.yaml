# conveyor — example configuration
#
# The engine knows nothing about GitHub, git or AI. Everything provider-specific
# lives in the scripts referenced below. See docs/CONTRACTS.md.

version: 1

concurrency:
  perSource: 1        # one item in flight per source. See CONTRACTS.md §5.
  global: 1           # v1 ships 1; raise to run sources in parallel.

poll: 5m              # how often to re-list every source
timeout: 90m          # default per-script timeout; stages may override

logs:
  retention: 30d      # runs older than this are swept
  sweepAt: "04:00"    # daily, and once on startup
                      # A run is PINNED and never swept while it is the most
                      # recent failed/blocked run of an item still in that state:
                      # retention must not delete the evidence for the thing
                      # currently asking for attention.

# ---------------------------------------------------------------------------
# Stages. Minimum two. Order defines the board's columns, left to right, and the
# default "next stage" on success.
#
# This is the state machine and nothing else. `work: true` says a stage runs
# something; WHAT it runs is the repo's business, at .conveyor/<stage> in each
# source's workdir. That is what lets one repo refine with a Claude skill and
# another with a long Codex prompt, on the same pipeline.
# ---------------------------------------------------------------------------
stages:
  - name: backlog
    # No work: nothing runs. Items land here and wait.

  - name: refining
    work: true                # the script lives in each source's repo at
    timeout: 30m              # .conveyor/refining — see "Onboarding a repo"
    onSuccess: ready          # explicit; would default to the next stage anyway
    onFailure: backlog        # a failed refine returns it to the pile

  - name: ready
    # --- reserved for v2, inert in v1 ---
    # v1 is a pipeline: items advance automatically and there is no dragging.
    # These keys are read and validated now so the schema does not change later.
    manual: false             # v2: engine never auto-advances OUT of this stage
    allowManual: true         # v2: may a human move a card INTO this stage?
                              # Some stages must never be entered by hand.

  - name: in-progress
    work: true                # .conveyor/in-progress in each source's repo
    onSuccess: done
    onFailure: blocked
    maxAttempts: 2            # after this many failures, force to onBlocked

  - name: done
    terminal: true            # no further transitions

  - name: blocked
    terminal: true            # needs a human; the board is how they see it

# ---------------------------------------------------------------------------
# Sources. Only what is listed here is ever scanned — there is no directory
# auto-discovery. Adding a repo is adding an entry.
#
# `provider:` names a folder under providers/. The engine finds list and move
# inside it by name, with or without an extension: list.sh, list.py and a
# compiled `list` are equivalent. Writing a new provider is creating a folder.
#
# A source cannot name its two scripts separately, on purpose — that would let
# one pair GitHub's list with Azure's move, and nothing downstream could tell.
# ---------------------------------------------------------------------------
sources:
  - name: mock
    provider: mock
    workdir: .

